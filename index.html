<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>缤纷叠影 - 精确小三角形版</title>
    <style>
        :root {
            --bg-color: #1a1c2c;
            --panel-bg: #282a40;
            --primary-color: #5bc0de;
            --text-color: #ffffff;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            background-image: radial-gradient(circle at 50% 0%, #2a2d4d 0%, #1a1c2c 100%);
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin-bottom: 5px;
            padding: 0 10px;
        }

        .game-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            flex-grow: 1;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 200;
        }
        .icon-btn:active { transform: scale(0.9); }

        #hint-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        #help-btn {
            color: #5bc0de;
            border-color: rgba(91, 192, 222, 0.4);
        }

        .timer-display {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .level-display {
            font-size: 14px;
            color: #a18cd1;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }
        .status-bar span { display: flex; align-items: center; gap: 5px; }

        .progress-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .match-text { font-size: 13px; color: #aaa; white-space: nowrap; width: 95px; }
        .progress-bar-wrapper {
            flex-grow: 1;
            height: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a18cd1 0%, #5bc0de 100%);
            border-radius: 6px;
            transition: width 0.3s ease-out, background 0.3s;
        }
        .progress-text { font-size: 13px; color: #ccc; width: 45px; text-align: right; }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .board-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            margin-bottom: 5px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .history-controls, .axis-controls {
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.2);
            padding: 3px;
            border-radius: 10px;
        }

        .small-icon-btn {
            width: 30px; height: 30px; border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: #aaa; font-size: 16px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }
        .small-icon-btn:not(:disabled):hover { background: rgba(255, 255, 255, 0.1); }
        .small-icon-btn:not(:disabled):active { background: rgba(255, 255, 255, 0.2); }
        .small-icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .axis-btn {
            font-size: 18px;
            font-weight: bold;
            color: #ccc;
            width: 30px; height: 30px;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
        }
        .axis-btn.active {
            background: rgba(91, 192, 222, 0.2);
            color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(91, 192, 222, 0.4);
        }

        .board-label { font-size: 13px; color: #aaa; }

        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            touch-action: none;
        }

        .board-wrapper.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(91, 192, 222, 0.3);
        }

        canvas {
            width: 100%; height: 100%;
            border-radius: 6px; display: block;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }

        .target-wrapper {
            width: 55%; aspect-ratio: 1 / 1;
            position: relative; margin-top: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            max-width: 100px;
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.2); }
        .action-btn .icon { font-size: 18px; }

        .btn {
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            border: none; color: #333; padding: 10px 20px;
            font-size: 15px; font-weight: bold; border-radius: 20px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 150; display: none; cursor: pointer;
        }
        .overlay.show { display: block; }

        .modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 22, 37, 0.95);
            padding: 25px 30px; border-radius: 16px;
            text-align: center; z-index: 300;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 50px rgba(91, 192, 222, 0.4);
            display: flex; flex-direction: column; gap: 15px;
            max-width: 90%; width: 320px;
        }
        .modal.show { transform: translate(-50%, -50%) scale(1); }
        .modal h2 { color: var(--primary-color); font-size: 20px; margin-bottom: 5px; }
        .modal p { font-size: 14px; color: #ccc; line-height: 1.6; text-align: left; margin-bottom: 10px;}
        
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .input-group input {
            padding: 10px; border-radius: 8px; border: 1px solid #555;
            background: #1a1c2c; color: #fff; font-size: 16px; text-align: center;
        }
        .input-group input:focus { outline: none; border-color: var(--primary-color); }

        .toast {
            position: fixed; bottom: 20%; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #fff;
            padding: 10px 20px; border-radius: 20px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 1000;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="top-bar">
        <div class="icon-btn" id="help-btn" title="查看规则">❓</div>
        <div class="game-title">缤纷叠影</div>
        <div class="icon-btn" id="hint-btn" title="进入/退出演示模式">💡</div>
    </div>
    
    <div class="timer-display">剩余时间: <span id="timer">--:--</span></div>
    <div class="level-display">当前题目编号: <span id="level-id">1</span></div>

    <div class="status-bar">
        <span>🔄 折叠: <span id="fold-count">0</span> / <span id="target-folds">4</span>次</span>
        <span>🎯 状态: <span id="status-text" style="color:#5bc0de;">进行中</span></span>
    </div>

    <div class="progress-container">
        <div class="match-text">匹配: <span id="match-count">0</span>/256</div>
        <div class="progress-bar-wrapper">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0%</div>
    </div>

    <div class="game-container">
        
        <div class="board-header">
            <div class="header-left">
                <div class="history-controls">
                    <button class="small-icon-btn" id="undo-btn" title="撤回" disabled>↩️</button>
                    <button class="small-icon-btn" id="redo-btn" title="前进" disabled>↪️</button>
                </div>
                <div class="axis-controls">
                    <div class="axis-btn" id="axis-h" title="锁定横折痕（上下折叠）">—</div>
                    <div class="axis-btn" id="axis-v" title="锁定竖折痕（左右折叠）">|</div>
                    <div class="axis-btn" id="axis-m" title="锁定主对角折痕（\）">\</div>
                    <div class="axis-btn" id="axis-a" title="锁定副对角折痕（/）">/</div>
                </div>
            </div>
            <div class="board-label">当前盘面</div>
        </div>

        <div class="board-wrapper active">
            <canvas id="game-canvas" width="600" height="600"></canvas>
        </div>

        <div class="board-wrapper target-wrapper">
            <div class="label" style="position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:13px; color:#aaa; white-space:nowrap;">目标图形</div>
            <canvas id="target-canvas" width="600" height="600"></canvas>
        </div>

        <div class="controls">
            <button class="action-btn" id="reset-btn">
                <span class="icon">1️⃣</span>
                <span>重置盘面</span>
            </button>
            <button class="action-btn" id="new-btn">
                <span class="icon">2️⃣</span>
                <span>新的开始</span>
            </button>
            <button class="action-btn" id="custom-btn">
                <span class="icon">3️⃣</span>
                <span>指定编号</span>
            </button>
        </div>

        <div class="modal" id="victory-popup">
            <h2>🎉 挑战成功！</h2>
            <div>
                <button class="small-btn" style="padding: 10px 20px;" onclick="closeVictory(true)">返回复盘</button>
                <button class="btn" style="margin-left: 10px; padding: 10px 20px;" onclick="closeVictory(false)">下一题</button>
            </div>
        </div>
        
        <div class="modal" id="rules-popup">
            <h2>📜 游戏规则</h2>
            <p>
                1. <b>拖动盘面</b>：决定折痕位置，程序会根据您的起点自动判断保留哪一侧，并用<b>红色高亮</b>框出。<br>
                2. <b>锁定方向</b>：点击撤回键右侧的图标，可锁定特定方向的折痕。<br>
                3. <b>双击确认</b>：选定折痕后，必须在盘面上快速<b>双击</b>，才会真正执行翻折动画。<br>
                4. <b>目标</b>：将彩色盘面折叠成下方“目标图形”。
            </p>
            <button class="btn" onclick="closeRules()">我知道了</button>
        </div>

        <div class="modal" id="custom-id-popup">
            <h2>🔢 指定题目编号</h2>
            <div class="input-group">
                <input type="number" id="custom-id-input" min="1" max="100000" placeholder="输入 1 - 100000" value="1">
            </div>
            <div>
                <button class="small-btn" onclick="closeCustomPopup()">取消</button>
                <button class="btn" style="margin-left: 10px;" onclick="confirmCustomId()">开始挑战</button>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        const N = 8;
        const TOTAL_TRIANGLES = N * N * 4; // 256
        const COLORS = [
            '#FF8C00', '#8A2BE2', '#DC143C', '#FFD700', 
            '#87CEEB', '#00008B', '#FF69B4', '#32CD32'
        ];

        let startGrid = [];
        let targetGrid = [];
        let currentGrid = [];
        
        let stateHistory = []; 
        let currentStateIndex = -1;
        
        let foldCount = 0;
        let targetFoldCount = 4;
        let isVictory = false;
        
        let isHintMode = false;
        let solutionSteps = []; 
        
        // 交互与动画状态
        let isDragging = false;
        let hasDragged = false;
        let startPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let dragAction = null;      
        let pendingAction = null;   
        let lastTap = 0;            
        let lockedAxis = null; 

        let isAnimating = false;
        let animationState = {
            action: null,
            startTime: 0,
            duration: 500,
            onComplete: null
        };

        let currentLevelId = 1;

        const gameCanvas = document.getElementById('game-canvas');
        const ctx = gameCanvas.getContext('2d');
        const targetCanvas = document.getElementById('target-canvas');
        const tCtx = targetCanvas.getContext('2d');
        const toastEl = document.getElementById('toast');
        const hintBtn = document.getElementById('hint-btn');
        const overlay = document.getElementById('overlay');
        
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const helpBtn = document.getElementById('help-btn');
        const rulesPopup = document.getElementById('rules-popup');
        const customIdPopup = document.getElementById('custom-id-popup');
        const customIdInput = document.getElementById('custom-id-input');

        const matchCountEl = document.getElementById('match-count');
        const progressFillEl = document.getElementById('progress-fill');
        const progressTextEl = document.getElementById('progress-text');

        const axisBtns = {
            'H': document.getElementById('axis-h'),
            'V': document.getElementById('axis-v'),
            'M': document.getElementById('axis-m'),
            'A': document.getElementById('axis-a')
        };

        function setLockedAxis(axis) {
            if (lockedAxis === axis) {
                lockedAxis = null; 
            } else {
                lockedAxis = axis;
            }
            for (let key in axisBtns) {
                if (key === lockedAxis) axisBtns[key].classList.add('active');
                else axisBtns[key].classList.remove('active');
            }
        }

        for (let key in axisBtns) {
            axisBtns[key].addEventListener('click', () => setLockedAxis(key));
        }

        // --- 伪随机数 ---
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // --- 核心算法 ---
        function createRandomGrid(rng) {
            const grid = [];
            for (let x = 0; x < N; x++) {
                grid[x] = [];
                for (let y = 0; y < N; y++) {
                    grid[x][y] = [
                        COLORS[Math.floor(rng() * COLORS.length)],
                        COLORS[Math.floor(rng() * COLORS.length)],
                        COLORS[Math.floor(rng() * COLORS.length)],
                        COLORS[Math.floor(rng() * COLORS.length)]
                    ];
                }
            }
            return grid;
        }

        function deepCopyGrid(grid) {
            return JSON.parse(JSON.stringify(grid));
        }

        function isGridEqual(g1, g2) {
            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        if (g1[x][y][i] !== g2[x][y][i]) return false;
                    }
                }
            }
            return true;
        }

        function calculateMatch(g1, g2) {
            let count = 0;
            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        if (g1[x][y][i] === g2[x][y][i]) count++;
                    }
                }
            }
            return count;
        }

        // 【终极算法】精确到小三角形的对称折叠
        function applyFold(grid, action) {
            const newGrid = deepCopyGrid(grid);
            const { axis, k, side } = action;

            function getTriangleIndex(fx, fy) {
                if (Math.abs(fx - 0.5) < 0.01 && Math.abs(fy - 0.25) < 0.01) return 0; // 上
                if (Math.abs(fx - 0.75) < 0.01 && Math.abs(fy - 0.5) < 0.01) return 1; // 右
                if (Math.abs(fx - 0.5) < 0.01 && Math.abs(fy - 0.75) < 0.01) return 2; // 下
                if (Math.abs(fx - 0.25) < 0.01 && Math.abs(fy - 0.5) < 0.01) return 3; // 左
                return 0;
            }

            const centers = [
                { dx: 0.5, dy: 0.25 }, // 上
                { dx: 0.75, dy: 0.5 }, // 右
                { dx: 0.5, dy: 0.75 }, // 下
                { dx: 0.25, dy: 0.5 }  // 左
            ];

            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        let cx = x + centers[i].dx;
                        let cy = y + centers[i].dy;
                        let isReserved = false;

                        // 判断当前小三角形中心是否在保留侧
                        if (axis === 'V') {
                            if (side === 'left' && cx < k) isReserved = true;
                            if (side === 'right' && cx > k) isReserved = true;
                        } else if (axis === 'H') {
                            if (side === 'top' && cy < k) isReserved = true;
                            if (side === 'bottom' && cy > k) isReserved = true;
                        } else if (axis === 'M') {
                            if (side === 'top-left' && cy - cx < k) isReserved = true;
                            if (side === 'bottom-right' && cy - cx > k) isReserved = true;
                        } else if (axis === 'A') {
                            if (side === 'top-left' && cx + cy < k) isReserved = true;
                            if (side === 'bottom-right' && cx + cy > k) isReserved = true;
                        }

                        if (isReserved) continue; // 在保留侧，颜色不变

                        // 计算中心点关于折痕的对称点
                        let cx_src = cx;
                        let cy_src = cy;
                        if (axis === 'V') {
                            cx_src = 2 * k - cx;
                        } else if (axis === 'H') {
                            cy_src = 2 * k - cy;
                        } else if (axis === 'M') {
                            cx_src = cy - k;
                            cy_src = cx + k;
                        } else if (axis === 'A') {
                            cx_src = k - cy;
                            cy_src = k - cx;
                        }

                        let x_src = Math.floor(cx_src);
                        let y_src = Math.floor(cy_src);
                        
                        // 如果对称点落在盘面内，则取该点颜色；如果在盘面外，则保持原样
                        if (x_src >= 0 && x_src < N && y_src >= 0 && y_src < N) {
                            let fx = cx_src - x_src;
                            let fy = cy_src - y_src;
                            let i_src = getTriangleIndex(fx, fy);
                            newGrid[x][y][i] = grid[x_src][y_src][i_src];
                        }
                    }
                }
            }
            return newGrid;
        }

        function generateTargetGrid(rng, grid, folds) {
            let tempGrid = deepCopyGrid(grid);
            solutionSteps = [];
            
            while (solutionSteps.length < folds) {
                let found = false;
                for (let attempt = 0; attempt < 50; attempt++) {
                    const axes = ['V', 'H', 'M', 'A'];
                    const axis = axes[Math.floor(rng() * axes.length)];
                    let action = null;
                    
                    if (axis === 'V' || axis === 'H') {
                        const k = Math.floor(rng() * (N - 1)) + 1;
                        const side = rng() > 0.5 ? (axis === 'V' ? 'left' : 'top') : (axis === 'V' ? 'right' : 'bottom');
                        action = { axis, k, side };
                    } else if (axis === 'M') {
                        const k = Math.floor(rng() * (2 * N - 1)) - (N - 1);
                        const side = rng() > 0.5 ? 'top-left' : 'bottom-right';
                        action = { axis, k, side };
                    } else if (axis === 'A') {
                        const k = Math.floor(rng() * (2 * N - 1)) + 1;
                        const side = rng() > 0.5 ? 'top-left' : 'bottom-right';
                        action = { axis, k, side };
                    }
                    
                    let testGrid = applyFold(tempGrid, action);
                    if (!isGridEqual(testGrid, tempGrid)) {
                        tempGrid = testGrid;
                        solutionSteps.push(action);
                        found = true;
                        break; 
                    }
                }
                if (!found) solutionSteps.push({ axis: 'V', k: 4, side: 'left' }); 
            }
            return tempGrid;
        }

        // --- 状态管理 ---
        function pushState(newGrid) {
            if (currentStateIndex < stateHistory.length - 1) {
                stateHistory = stateHistory.slice(0, currentStateIndex + 1);
            }
            currentGrid = deepCopyGrid(newGrid); 
            stateHistory.push(currentGrid);
            currentStateIndex = stateHistory.length - 1;
            
            foldCount = currentStateIndex;
            document.getElementById('fold-count').innerText = foldCount;
            
            updateHistoryButtons();
            updateProgress();
            checkVictory();
            renderGame();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = (currentStateIndex <= 0) || isVictory || isHintMode || isAnimating;
            redoBtn.disabled = (currentStateIndex >= stateHistory.length - 1) || isVictory || isHintMode || isAnimating;
        }

        function goUndo() {
            if (currentStateIndex > 0) {
                currentStateIndex--;
                currentGrid = deepCopyGrid(stateHistory[currentStateIndex]);
                foldCount = currentStateIndex;
                document.getElementById('fold-count').innerText = foldCount;
                pendingAction = null; 
                updateHistoryButtons();
                updateProgress();
                renderGame();
            }
        }

        function goRedo() {
            if (currentStateIndex < stateHistory.length - 1) {
                currentStateIndex++;
                currentGrid = deepCopyGrid(stateHistory[currentStateIndex]);
                foldCount = currentStateIndex;
                document.getElementById('fold-count').innerText = foldCount;
                pendingAction = null; 
                updateHistoryButtons();
                updateProgress();
                renderGame();
            }
        }

        function updateProgress() {
            const matchCount = calculateMatch(currentGrid, targetGrid);
            const percent = Math.floor((matchCount / TOTAL_TRIANGLES) * 100);
            
            matchCountEl.innerText = matchCount;
            progressFillEl.style.width = `${percent}%`;
            progressTextEl.innerText = `${percent}%`;

            if (percent === 100) {
                progressFillEl.style.background = 'linear-gradient(90deg, #32CD32 0%, #00FF00 100%)';
                progressTextEl.style.color = '#32CD32';
            } else {
                progressFillEl.style.background = 'linear-gradient(90deg, #a18cd1 0%, #5bc0de 100%)';
                progressTextEl.style.color = '#ccc';
            }
        }

        // --- 绘制逻辑 ---
        function drawBoard(ctx, grid) {
            const width = ctx.canvas.width;
            const cellSize = width / N;
            ctx.clearRect(0, 0, width, width);

            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    const px = x * cellSize, py = y * cellSize;
                    const cx = px + cellSize / 2, cy = py + cellSize / 2;
                    const colors = grid[x][y];

                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[0]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py); ctx.lineTo(px + cellSize, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[1]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py + cellSize); ctx.lineTo(px, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[2]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px, py + cellSize); ctx.lineTo(px, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[3]; ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py + cellSize);
                    ctx.moveTo(px + cellSize, py); ctx.lineTo(px, py + cellSize);
                    ctx.stroke();
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px, py, cellSize, cellSize);
                }
            }
        }

        function getFoldRegionPath(action) {
            const width = gameCanvas.width;
            const cellSize = width / N;
            const { axis, k, side } = action;
            let path = [];

            if (axis === 'V') {
                let x = k * cellSize;
                if (side === 'left') path = [{x:0, y:0}, {x:x, y:0}, {x:x, y:width}, {x:0, y:width}];
                else path = [{x:x, y:0}, {x:width, y:0}, {x:width, y:width}, {x:x, y:width}];
            } else if (axis === 'H') {
                let y = k * cellSize;
                if (side === 'top') path = [{x:0, y:0}, {x:width, y:0}, {x:width, y:y}, {x:0, y:y}];
                else path = [{x:0, y:y}, {x:width, y:y}, {x:width, y:width}, {x:0, y:width}];
            } else if (axis === 'M') {
                let c = k * cellSize;
                if (side === 'top-left') {
                    let p1 = {x: 0, y: c};
                    let p2 = {x: width - c, y: width};
                    if (c < 0) { p1 = {x: -c, y: 0}; p2 = {x: width, y: width + c}; }
                    path = [{x:0, y:0}, p2, p1];
                } else {
                    let p1 = {x: 0, y: c};
                    let p2 = {x: width - c, y: width};
                    if (c < 0) { p1 = {x: -c, y: 0}; p2 = {x: width, y: width + c}; }
                    path = [{x:width, y:width}, p1, p2];
                }
            } else if (axis === 'A') {
                let c = k * cellSize;
                if (side === 'top-left') {
                    let p1 = {x: 0, y: c};
                    let p2 = {x: c, y: 0};
                    if (c > width) { p1 = {x:c-width, y:width}; p2 = {x:width, y:c-width}; }
                    path = [{x:0, y:0}, p2, p1];
                } else {
                    let p1 = {x: 0, y: c};
                    let p2 = {x: c, y: 0};
                    if (c > width) { p1 = {x:c-width, y:width}; p2 = {x:width, y:c-width}; }
                    path = [{x:width, y:width}, p1, p2];
                }
            }
            return path;
        }

        function renderGame(animProgress = 0) {
            drawBoard(ctx, currentGrid);
            
            const currentAction = isAnimating ? animationState.action : (isDragging ? dragAction : pendingAction);
            
            if (currentAction) {
                const path = getFoldRegionPath(currentAction);
                
                if (isAnimating || pendingAction) {
                    ctx.beginPath();
                    if (path.length > 0) {
                        ctx.moveTo(path[0].x, path[0].y);
                        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                        ctx.closePath();
                        let alpha = isAnimating ? 0.4 * (1 - animProgress) : 0.15;
                        ctx.fillStyle = `rgba(255, 69, 0, ${alpha})`;
                        ctx.fill();
                    }
                }

                ctx.save();
                ctx.strokeStyle = '#FF4500';
                ctx.lineWidth = isAnimating ? (6 + Math.sin(animProgress * Math.PI) * 4) : 4;
                ctx.setLineDash([10, 8]);
                if (isAnimating || pendingAction) { ctx.shadowBlur = 15; ctx.shadowColor = '#FF4500'; }
                
                ctx.beginPath();
                if (path.length > 0) {
                    ctx.moveTo(path[0].x, path[0].y);
                    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();

                drawDragHintLine(ctx, currentAction, (isAnimating || pendingAction) ? '#FF4500' : '#ffffff');
            }
        }

        function drawDragHintLine(ctx, action, color) {
            if (!action) return;
            const width = ctx.canvas.width;
            const cellSize = width / N;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = color === '#ffffff' ? 3 : 5;
            ctx.setLineDash([8, 6]);

            if (action.axis === 'V') {
                let x = action.k * cellSize; ctx.moveTo(x, 0); ctx.lineTo(x, width);
            } else if (action.axis === 'H') {
                let y = action.k * cellSize; ctx.moveTo(0, y); ctx.lineTo(width, y);
            } else if (action.axis === 'M') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = (N - action.k) * cellSize, p2y = width;
                if (action.k < 0) { p1x = -action.k * cellSize; p1y = 0; p2x = width; p2y = (N + action.k) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            } else if (action.axis === 'A') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = action.k * cellSize, p2y = 0;
                if (action.k > N) { p1x = (action.k - N) * cellSize; p1y = width; p2x = width; p2y = (action.k - N) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // --- 动画执行引擎 ---
        function startFoldAnimation(action, onComplete) {
            if (isAnimating) return;
            isAnimating = true;
            pendingAction = null; 
            animationState.action = action;
            animationState.startTime = performance.now();
            animationState.onComplete = onComplete;

            function animate(time) {
                let elapsed = time - animationState.startTime;
                let progress = Math.min(elapsed / animationState.duration, 1);
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                
                renderGame(easeProgress);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isAnimating = false;
                    animationState.action = null;
                    if (animationState.onComplete) {
                        animationState.onComplete();
                    }
                    renderGame();
                }
            }
            requestAnimationFrame(animate);
            updateHistoryButtons();
        }

        // --- 交互事件 ---
        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
            } else if (evt.changedTouches && evt.changedTouches.length > 0) {
                clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY;
            }
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }

        function getDragAction(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            if (Math.hypot(dx, dy) < 20) return null;

            const cellSize = gameCanvas.width / N;
            let axis = lockedAxis;

            if (!axis) {
                const projV = Math.abs(dx), projH = Math.abs(dy);
                const projM = Math.abs(dx + dy) / Math.SQRT2;
                const projA = Math.abs(dx - dy) / Math.SQRT2;

                let maxVal = projV; axis = 'V';
                if (projH > maxVal) { maxVal = projH; axis = 'H'; }
                if (projM > maxVal) { maxVal = projM; axis = 'M'; }
                if (projA > maxVal) { maxVal = projA; axis = 'A'; }
            }

            if (axis === 'V') {
                let k = Math.round(endX / cellSize);
                if (k <= 0 || k >= N) return null;
                let side = startX < k * cellSize ? 'left' : 'right';
                return { axis: 'V', k: k, side: side };
            } else if (axis === 'H') {
                let k = Math.round(endY / cellSize);
                if (k <= 0 || k >= N) return null;
                let side = startY < k * cellSize ? 'top' : 'bottom';
                return { axis: 'H', k: k, side: side };
            } else if (axis === 'M') {
                let k = Math.round((endY - endX) / cellSize);
                let side = (startY - startX) < k * cellSize ? 'top-left' : 'bottom-right';
                return { axis: 'M', k: k, side: side };
            } else if (axis === 'A') {
                let k = Math.round((endY + endX) / cellSize);
                let side = (startX + startY) < k * cellSize ? 'top-left' : 'bottom-right';
                return { axis: 'A', k: k, side: side };
            }
            return null;
        }

        function startDrag(e) {
            if (isVictory || isHintMode || isAnimating) return;
            e.preventDefault();
            
            isDragging = true;
            hasDragged = false; 
            const pos = getMousePos(gameCanvas, e);
            startPos = pos; 
            currentPos = pos;
            dragAction = null;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            currentPos = getMousePos(gameCanvas, e);
            
            const dist = Math.hypot(currentPos.x - startPos.x, currentPos.y - startPos.y);
            
            if (dist > 15) {
                hasDragged = true;
                pendingAction = null; 
                dragAction = getDragAction(startPos.x, startPos.y, currentPos.x, currentPos.y);
                renderGame();
            }
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            const pos = getMousePos(gameCanvas, e);
            const dist = Math.hypot(pos.x - startPos.x, pos.y - startPos.y);

            if (hasDragged && dragAction) {
                pendingAction = dragAction;
                renderGame();
            } else if (dist < 15) {
                // 触发点击/双击判定
                const now = Date.now();
                if (now - lastTap < 300) {
                    if (pendingAction) {
                        executePendingAction();
                    }
                    lastTap = 0; 
                } else {
                    lastTap = now;
                }
            }
            dragAction = null;
        }

        // 原生双击事件作为双重保险
        gameCanvas.addEventListener('dblclick', (e) => {
            e.preventDefault();
            if (isVictory || isHintMode || isAnimating) return;
            if (pendingAction) {
                executePendingAction();
            }
        });

        function executePendingAction() {
            if (!pendingAction) return;
            const action = pendingAction;
            pendingAction = null;
            startFoldAnimation(action, () => {
                const nextGrid = applyFold(currentGrid, action);
                pushState(nextGrid); 
            });
        }

        gameCanvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);
        gameCanvas.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('touchend', endDrag);

        // --- 演示模式 ---
        let clickTimer = null;
        
        hintBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isAnimating || isVictory) return;

            isHintMode = !isHintMode;
            if (isHintMode) {
                hintBtn.classList.add('active');
                overlay.classList.add('show');
                showToast("进入演示模式 (单击下一步, 双击上一步)");
                
                currentStateIndex = 0;
                currentGrid = deepCopyGrid(startGrid);
                stateHistory = [deepCopyGrid(startGrid)];
                foldCount = 0;
                pendingAction = null; 
                document.getElementById('fold-count').innerText = 0;
                
                updateHistoryButtons();
                updateProgress();
                renderGame();
            } else {
                hintBtn.classList.remove('active');
                overlay.classList.remove('show');
                showToast("退出演示模式");
                updateHistoryButtons();
            }
        });

        overlay.addEventListener('click', (e) => {
            if (!isHintMode || isAnimating) return;

            if (clickTimer !== null) {
                clearTimeout(clickTimer);
                clickTimer = null;
                goUndo(); 
            } else {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    demoNextStep();
                }, 250);
            }
        });

        function demoNextStep() {
            if (currentStateIndex >= solutionSteps.length) {
                showToast("已经是最后一步了");
                return;
            }

            const action = solutionSteps[currentStateIndex];
            startFoldAnimation(action, () => {
                const nextGrid = applyFold(currentGrid, action);
                pushState(nextGrid); 
                showToast(`演示第 ${currentStateIndex} / ${solutionSteps.length} 步`);
            });
        }

        // --- 控制逻辑 ---
        function loadLevel(levelId) {
            currentLevelId = levelId;
            document.getElementById('level-id').innerText = levelId;
            
            isVictory = false;
            isDragging = false;
            hasDragged = false;
            dragAction = null;
            pendingAction = null;
            isHintMode = false;
            isAnimating = false;
            foldCount = 0;
            
            hintBtn.classList.remove('active');
            overlay.classList.remove('show');
            document.getElementById('victory-popup').classList.remove('show');
            rulesPopup.classList.remove('show');
            customIdPopup.classList.remove('show');

            const rng = mulberry32(levelId);

            targetFoldCount = Math.floor(rng() * 3) + 4;
            document.getElementById('target-folds').innerText = targetFoldCount;
            document.getElementById('status-text').innerText = '进行中';
            document.getElementById('status-text').style.color = '#5bc0de';

            startGrid = createRandomGrid(rng);
            targetGrid = generateTargetGrid(rng, startGrid, targetFoldCount);
            
            if (isGridEqual(startGrid, targetGrid)) {
                return loadLevel(levelId + 1 > 100000 ? 1 : levelId + 1);
            }
            
            stateHistory = [deepCopyGrid(startGrid)];
            currentStateIndex = 0;
            currentGrid = deepCopyGrid(startGrid);
            
            document.getElementById('fold-count').innerText = 0;
            updateHistoryButtons();
            updateProgress(); 
            renderGame();
            drawBoard(tCtx, targetGrid);
            startTimer();
        }

        function resetCurrentLevel() {
            if (isAnimating) return;
            isVictory = false;
            isDragging = false;
            hasDragged = false;
            pendingAction = null;
            isHintMode = false;
            
            hintBtn.classList.remove('active');
            overlay.classList.remove('show');
            document.getElementById('victory-popup').classList.remove('show');

            stateHistory = [deepCopyGrid(startGrid)];
            currentStateIndex = 0;
            currentGrid = deepCopyGrid(startGrid);
            
            document.getElementById('fold-count').innerText = 0;
            document.getElementById('status-text').innerText = '进行中';
            document.getElementById('status-text').style.color = '#5bc0de';
            
            updateHistoryButtons();
            updateProgress();
            renderGame();
            startTimer();
        }

        function checkVictory() {
            if (isGridEqual(currentGrid, targetGrid)) {
                if (isVictory) return;
                isVictory = true;
                document.getElementById('status-text').innerText = '已完成';
                document.getElementById('status-text').style.color = '#32CD32';
                document.getElementById('victory-popup').classList.add('show');
                stopTimer();
                updateHistoryButtons();
                
                if (isHintMode) {
                    hintBtn.classList.remove('active');
                    overlay.classList.remove('show');
                    isHintMode = false;
                }
            }
        }

        function closeVictory(backToReview) {
            document.getElementById('victory-popup').classList.remove('show');
            if (backToReview) {
                isVictory = false; 
                document.getElementById('status-text').innerText = '复盘模式';
                document.getElementById('status-text').style.color = '#FFD700';
                updateHistoryButtons();
            } else {
                let nextId = Math.floor(Math.random() * 100000) + 1;
                loadLevel(nextId);
            }
        }

        function closeRules() { rulesPopup.classList.remove('show'); }

        function openCustomPopup() {
            if (isAnimating) return;
            customIdInput.value = currentLevelId;
            customIdPopup.classList.add('show');
        }
        
        function closeCustomPopup() { customIdPopup.classList.remove('show'); }

        function confirmCustomId() {
            let val = parseInt(customIdInput.value);
            if (isNaN(val) || val < 1 || val > 100000) {
                showToast("请输入 1 到 100000 之间的数字");
                return;
            }
            loadLevel(val);
        }

        function showToast(msg) {
            toastEl.innerText = msg;
            toastEl.classList.add('show');
            if (toastEl.timer) clearTimeout(toastEl.timer);
            toastEl.timer = setTimeout(() => { 
                toastEl.classList.remove('show'); 
            }, 2000);
        }

        undoBtn.addEventListener('click', goUndo);
        redoBtn.addEventListener('click', goRedo);
        helpBtn.addEventListener('click', () => rulesPopup.classList.add('show'));
        
        document.getElementById('reset-btn').addEventListener('click', resetCurrentLevel);
        document.getElementById('new-btn').addEventListener('click', () => {
            let nextId = Math.floor(Math.random() * 100000) + 1;
            loadLevel(nextId);
        });
        document.getElementById('custom-btn').addEventListener('click', openCustomPopup);

        let timeLeft = 300;
        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 300;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isVictory) {
                        document.getElementById('status-text').innerText = '时间到';
                        document.getElementById('status-text').style.color = '#DC143C';
                        isVictory = true;
                        updateHistoryButtons();
                    }
                }
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        loadLevel(Math.floor(Math.random() * 100000) + 1);
    </script>
