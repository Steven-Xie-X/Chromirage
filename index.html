<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>缤纷叠影 - 自由折痕版</title>
    <style>
        :root {
            --bg-color: #1a1c2c;
            --panel-bg: #282a40;
            --primary-color: #5bc0de;
            --text-color: #ffffff;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            background-image: radial-gradient(circle at 50% 0%, #2a2d4d 0%, #1a1c2c 100%);
            overflow: hidden;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .timer {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #ccc;
        }

        .status-bar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            touch-action: none;
        }

        .board-wrapper.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(91, 192, 222, 0.3);
        }

        .label {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        .target-wrapper {
            width: 50%;
            aspect-ratio: 1 / 1;
            position: relative;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            border: none;
            color: #333;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }

        .small-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .small-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }
        .small-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .victory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 22, 37, 0.95);
            padding: 25px 40px;
            border-radius: 16px;
            text-align: center;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 50px rgba(91, 192, 222, 0.4);
        }
        .victory.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .victory h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 20px;
        }
        .victory p {
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">缤纷叠影</div>
        <div class="timer">剩余: <span id="timer">--:--</span></div>
    </div>

    <div class="status-bar">
        <span>🔄 折叠: <span id="fold-count">0</span> / <span id="target-folds">4</span>次</span>
        <span>🎯 状态: <span id="status-text" style="color:#5bc0de;">进行中</span></span>
    </div>

    <div class="game-container" id="game-container">
        <div class="board-wrapper active">
            <div class="label">当前盘面 (全网格自由折叠)</div>
            <canvas id="game-canvas" width="600" height="600"></canvas>
        </div>

        <div class="board-wrapper target-wrapper">
            <div class="label">目标图形</div>
            <canvas id="target-canvas" width="600" height="600"></canvas>
        </div>

        <div class="controls">
            <button class="small-btn" onclick="initGame()">🔄 重新开始</button>
            <button class="small-btn" id="undo-btn" onclick="undo()" disabled>↩️ 撤回</button>
            <button class="small-btn" onclick="cheatFold()">✨ 自动折叠</button>
        </div>

        <div class="victory" id="victory-popup">
            <h2>🎉 挑战成功！</h2>
            <p>你完美复刻了目标图案</p>
            <button class="btn" style="margin-top: 15px;" onclick="closeVictory()">继续挑战</button>
        </div>
    </div>

    <script>
        // 游戏基础配置
        const N = 8; // 8x8网格
        // 颜色集，对应上、右、下、左四个方向的三角形
        const COLORS = [
            '#FF8C00', '#8A2BE2', '#DC143C', '#FFD700', 
            '#87CEEB', '#00008B', '#FF69B4', '#32CD32'
        ];

        let startGrid = [];
        let targetGrid = [];
        let currentGrid = [];
        let historyStack = [];
        let foldCount = 0;
        let targetFoldCount = 4;
        let isVictory = false;
        
        // 交互状态
        let isDragging = false;
        let startPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let dragAction = null; // 当前实时预测的折叠动作

        const gameCanvas = document.getElementById('game-canvas');
        const ctx = gameCanvas.getContext('2d');
        const targetCanvas = document.getElementById('target-canvas');
        const tCtx = targetCanvas.getContext('2d');

        // --- 核心算法 ---

        // 生成随机四向三角形网格
        function createRandomGrid() {
            const grid = [];
            for (let x = 0; x < N; x++) {
                grid[x] = [];
                for (let y = 0; y < N; y++) {
                    grid[x][y] = [
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)]
                    ];
                }
            }
            return grid;
        }

        function deepCopyGrid(grid) {
            return JSON.parse(JSON.stringify(grid));
        }

        function isGridEqual(g1, g2) {
            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        if (g1[x][y][i] !== g2[x][y][i]) return false;
                    }
                }
            }
            return true;
        }

        // 镜像翻转三角形方向
        // V: 左右换, H: 上下换, M: 主对角换, A: 副对角换
        function mirrorColors(colors, axis) {
            if (axis === 'V') return [colors[0], colors[3], colors[2], colors[1]];
            if (axis === 'H') return [colors[2], colors[1], colors[0], colors[3]];
            if (axis === 'M') return [colors[3], colors[2], colors[1], colors[0]];
            if (axis === 'A') return [colors[1], colors[0], colors[3], colors[2]];
            return colors;
        }

        // 执行折叠 (支持任意网格线)
        function applyFold(grid, action) {
            const newGrid = deepCopyGrid(grid);
            const { axis, k, side } = action;

            if (axis === 'V') { // 垂直折痕，位置 x = k
                if (side === 'left') {
                    for (let x = 0; x < k; x++) {
                        let x2 = 2 * k - x - 1;
                        if (x2 >= 0 && x2 < N) {
                            for (let y = 0; y < N; y++) {
                                newGrid[x2][y] = mirrorColors(grid[x][y], 'V');
                            }
                        }
                    }
                } else {
                    for (let x = k; x < N; x++) {
                        let x2 = 2 * k - x - 1;
                        if (x2 >= 0 && x2 < N) {
                            for (let y = 0; y < N; y++) {
                                newGrid[x2][y] = mirrorColors(grid[x][y], 'V');
                            }
                        }
                    }
                }
            } else if (axis === 'H') { // 水平折痕，位置 y = k
                if (side === 'top') {
                    for (let y = 0; y < k; y++) {
                        let y2 = 2 * k - y - 1;
                        if (y2 >= 0 && y2 < N) {
                            for (let x = 0; x < N; x++) {
                                newGrid[x][y2] = mirrorColors(grid[x][y], 'H');
                            }
                        }
                    }
                } else {
                    for (let y = k; y < N; y++) {
                        let y2 = 2 * k - y - 1;
                        if (y2 >= 0 && y2 < N) {
                            for (let x = 0; x < N; x++) {
                                newGrid[x][y2] = mirrorColors(grid[x][y], 'H');
                            }
                        }
                    }
                }
            } else if (axis === 'M') { // 主对角折痕 y - x = k
                if (side === 'top-left') {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (y - x < k) {
                                let x2 = y - k;
                                let y2 = x + k;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) {
                                    newGrid[x2][y2] = mirrorColors(grid[x][y], 'M');
                                }
                            }
                        }
                    }
                } else {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (y - x > k) {
                                let x2 = y - k;
                                let y2 = x + k;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) {
                                    newGrid[x2][y2] = mirrorColors(grid[x][y], 'M');
                                }
                            }
                        }
                    }
                }
            } else if (axis === 'A') { // 副对角折痕 x + y = k
                if (side === 'bottom-left') {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (x + y < k) {
                                let x2 = k - y - 1;
                                let y2 = k - x - 1;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) {
                                    newGrid[x2][y2] = mirrorColors(grid[x][y], 'A');
                                }
                            }
                        }
                    }
                } else {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (x + y > k) {
                                let x2 = k - y - 1;
                                let y2 = k - x - 1;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) {
                                    newGrid[x2][y2] = mirrorColors(grid[x][y], 'A');
                                }
                            }
                        }
                    }
                }
            }
            return newGrid;
        }

        // 生成目标图案 (正向模拟，支持所有折痕)
        function generateTargetGrid(grid, folds) {
            let tempGrid = deepCopyGrid(grid);
            
            for (let i = 0; i < folds; i++) {
                let action = null;
                let currentTemp = deepCopyGrid(tempGrid);
                
                // 最多尝试10次生成有效的动作，防止死循环
                for (let attempt = 0; attempt < 10; attempt++) {
                    const axes = ['V', 'H', 'M', 'A'];
                    const axis = axes[Math.floor(Math.random() * axes.length)];
                    
                    if (axis === 'V' || axis === 'H') {
                        const k = Math.floor(Math.random() * (N - 1)) + 1; // 1 到 N-1
                        const side = Math.random() > 0.5 ? (axis === 'V' ? 'left' : 'top') : (axis === 'V' ? 'right' : 'bottom');
                        action = { axis, k, side };
                    } else if (axis === 'M') {
                        const k = Math.floor(Math.random() * (2 * N - 1)) - (N - 1); // -(N-1) 到 N-1
                        const side = Math.random() > 0.5 ? 'top-left' : 'bottom-right';
                        action = { axis, k, side };
                    } else if (axis === 'A') {
                        const k = Math.floor(Math.random() * (2 * N - 1)) + 1; // 1 到 2N-1
                        const side = Math.random() > 0.5 ? 'bottom-left' : 'top-right';
                        action = { axis, k, side };
                    }
                    
                    tempGrid = applyFold(tempGrid, action);
                    if (!isGridEqual(tempGrid, currentTemp)) break; // 确保确实改变了图案
                }
            }
            return tempGrid;
        }

        // --- 绘制逻辑 ---

        function drawBoard(ctx, grid) {
            const width = ctx.canvas.width;
            const cellSize = width / N;

            ctx.clearRect(0, 0, width, width);

            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    const px = x * cellSize;
                    const py = y * cellSize;
                    const cx = px + cellSize / 2;
                    const cy = py + cellSize / 2;
                    const colors = grid[x][y];

                    // 上
                    ctx.beginPath();
                    ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[0]; ctx.fill();
                    
                    // 右
                    ctx.beginPath();
                    ctx.moveTo(px + cellSize, py); ctx.lineTo(px + cellSize, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[1]; ctx.fill();
                    
                    // 下
                    ctx.beginPath();
                    ctx.moveTo(px + cellSize, py + cellSize); ctx.lineTo(px, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[2]; ctx.fill();
                    
                    // 左
                    ctx.beginPath();
                    ctx.moveTo(px, py + cellSize); ctx.lineTo(px, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[3]; ctx.fill();

                    // 辅助线
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py + cellSize);
                    ctx.moveTo(px + cellSize, py); ctx.lineTo(px, py + cellSize);
                    ctx.stroke();
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px, py, cellSize, cellSize);
                }
            }
        }

        // 绘制动态折痕
        function drawHintLine(ctx, action) {
            if (!action) return;
            const width = ctx.canvas.width;
            const cellSize = width / N;

            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';

            if (action.axis === 'V') {
                let x = action.k * cellSize;
                ctx.moveTo(x, 0); ctx.lineTo(x, width);
            } else if (action.axis === 'H') {
                let y = action.k * cellSize;
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            } else if (action.axis === 'M') {
                // y - x = k * cellSize
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = (N - action.k) * cellSize, p2y = width;
                if (action.k < 0) {
                    p1x = -action.k * cellSize; p1y = 0;
                    p2x = width; p2y = (N + action.k) * cellSize;
                }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            } else if (action.axis === 'A') {
                // x + y = k * cellSize
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = action.k * cellSize, p2y = 0;
                if (action.k > N) {
                    p1x = (action.k - N) * cellSize; p1y = width;
                    p2x = width; p2y = (action.k - N) * cellSize;
                }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            }
            
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
        }

        function renderGame() {
            drawBoard(ctx, currentGrid);
            if (isDragging && dragAction) {
                drawHintLine(ctx, dragAction);
            }
        }

        // --- 交互事件 ---

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            } else if (evt.changedTouches && evt.changedTouches.length > 0) {
                clientX = evt.changedTouches[0].clientX;
                clientY = evt.changedTouches[0].clientY;
            }
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // 根据拖拽位置实时计算并吸附动作
        function getDragAction(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            const dist = Math.hypot(dx, dy);
            
            if (dist < 30) return null; // 拖拽太短不响应

            const cellSize = gameCanvas.width / N;
            
            // 判断主轴方向
            const projV = Math.abs(dx);
            const projH = Math.abs(dy);
            const projM = Math.abs(dx + dy) / Math.SQRT2;
            const projA = Math.abs(dx - dy) / Math.SQRT2;

            let maxVal = projV;
            let maxAxis = 'V';
            
            if (projH > maxVal) { maxVal = projH; maxAxis = 'H'; }
            if (projM > maxVal) { maxVal = projM; maxAxis = 'M'; }
            if (projA > maxVal) { maxVal = projA; maxAxis = 'A'; }

            // 计算吸附的折痕位置(k值) 和 折叠侧
            if (maxAxis === 'V') {
                let k = Math.round(endX / cellSize);
                if (k <= 0 || k >= N) return null; 
                return { axis: 'V', k: k, side: dx > 0 ? 'left' : 'right' };
            } else if (maxAxis === 'H') {
                let k = Math.round(endY / cellSize);
                if (k <= 0 || k >= N) return null;
                return { axis: 'H', k: k, side: dy > 0 ? 'top' : 'bottom' };
            } else if (maxAxis === 'M') {
                let k = Math.round((endY - endX) / cellSize);
                return { axis: 'M', k: k, side: (dx + dy) > 0 ? 'top-left' : 'bottom-right' };
            } else if (maxAxis === 'A') {
                let k = Math.round((endY + endX) / cellSize);
                return { axis: 'A', k: k, side: (dx - dy) > 0 ? 'bottom-left' : 'top-right' };
            }
            return null;
        }

        function startDrag(e) {
            if (isVictory) return;
            e.preventDefault();
            isDragging = true;
            const pos = getMousePos(gameCanvas, e);
            startPos = pos;
            currentPos = pos;
            dragAction = null;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            currentPos = getMousePos(gameCanvas, e);
            dragAction = getDragAction(startPos.x, startPos.y, currentPos.x, currentPos.y);
            renderGame();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            if (dragAction) {
                historyStack.push(deepCopyGrid(currentGrid));
                document.getElementById('undo-btn').disabled = false;

                currentGrid = applyFold(currentGrid, dragAction);
                foldCount++;
                document.getElementById('fold-count').innerText = foldCount;
                
                checkVictory();
            }
            
            dragAction = null;
            renderGame();
        }

        gameCanvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);
        
        gameCanvas.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('touchend', endDrag);

        // --- 控制逻辑 ---

        function initGame() {
            isVictory = false;
            isDragging = false;
            dragAction = null;
            foldCount = 0;
            historyStack = [];
            document.getElementById('undo-btn').disabled = true;
            
            targetFoldCount = Math.floor(Math.random() * 3) + 4;
            document.getElementById('target-folds').innerText = targetFoldCount;
            document.getElementById('fold-count').innerText = 0;
            document.getElementById('status-text').innerText = '进行中';
            document.getElementById('status-text').style.color = '#5bc0de';
            document.getElementById('victory-popup').classList.remove('show');

            startGrid = createRandomGrid();
            currentGrid = deepCopyGrid(startGrid);
            
            targetGrid = generateTargetGrid(startGrid, targetFoldCount);
            
            if (isGridEqual(startGrid, targetGrid)) {
                return initGame();
            }
            
            renderGame();
            drawBoard(tCtx, targetGrid);
            startTimer();
        }

        function undo() {
            if (historyStack.length === 0 || isVictory) return;
            currentGrid = historyStack.pop();
            foldCount = Math.max(0, foldCount - 1);
            document.getElementById('fold-count').innerText = foldCount;
            
            if (historyStack.length === 0) {
                document.getElementById('undo-btn').disabled = true;
            }
            renderGame();
        }

        function cheatFold() {
            if (isVictory || isDragging) return;
            const axes = ['V', 'H', 'M', 'A'];
            const axis = axes[Math.floor(Math.random() * axes.length)];
            let action;
            
            if (axis === 'V') action = { axis, k: Math.floor(Math.random()*(N-1))+1, side: Math.random()>0.5?'left':'right' };
            if (axis === 'H') action = { axis, k: Math.floor(Math.random()*(N-1))+1, side: Math.random()>0.5?'top':'bottom' };
            if (axis === 'M') action = { axis, k: Math.floor(Math.random()*(2*N-1))-(N-1), side: Math.random()>0.5?'top-left':'bottom-right' };
            if (axis === 'A') action = { axis, k: Math.floor(Math.random()*(2*N-1))+1, side: Math.random()>0.5?'bottom-left':'top-right' };
            
            historyStack.push(deepCopyGrid(currentGrid));
            document.getElementById('undo-btn').disabled = false;
            
            currentGrid = applyFold(currentGrid, action);
            foldCount++;
            document.getElementById('fold-count').innerText = foldCount;
            checkVictory();
            renderGame();
        }

        function checkVictory() {
            if (isGridEqual(currentGrid, targetGrid)) {
                isVictory = true;
                document.getElementById('status-text').innerText = '已完成';
                document.getElementById('status-text').style.color = '#32CD32';
                document.getElementById('victory-popup').classList.add('show');
                stopTimer();
            }
        }

        function closeVictory() {
            document.getElementById('victory-popup').classList.remove('show');
            initGame();
        }

        // --- 计时器 ---
        let timeLeft = 300;
        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 300;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isVictory) {
                        document.getElementById('status-text').innerText = '时间到';
                        document.getElementById('status-text').style.color = '#DC143C';
                        isVictory = true;
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        initGame();
    </script>
</body>
</html>
