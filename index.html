<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>小游戏合集</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --card-border: rgba(255, 255, 255, .14);
    --text: #eef1ff;
    --text-dim: rgba(238, 241, 255, .60);
    --accent1: #7c5cff;
    --accent2: #22d3ee;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    padding: 52px 20px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 18% 12%, rgba(124, 92, 255, .42) 0%, transparent 52%),
      radial-gradient(circle at 84% 78%, rgba(34, 211, 238, .26) 0%, transparent 52%),
      radial-gradient(circle at 50% 112%, rgba(236, 72, 153, .20) 0%, transparent 55%),
      linear-gradient(165deg, #0a0c1b 0%, #141034 48%, #090b17 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景细网格 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(circle at 50% 32%, #000 0%, transparent 72%);
    mask-image: radial-gradient(circle at 50% 32%, #000 0%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }

  /* 漂浮光斑 */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .5;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 {
    width: 340px; height: 340px;
    left: -90px; top: -90px;
    background: radial-gradient(circle, #7c5cff, transparent 70%);
    animation: float1 16s ease-in-out infinite;
  }
  .blob-2 {
    width: 300px; height: 300px;
    right: -80px; bottom: -70px;
    background: radial-gradient(circle, #22d3ee, transparent 70%);
    animation: float2 20s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(60px, 50px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-50px, -60px) scale(1.10); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
  }

  /* ============ 头部 ============ */
  header { text-align: center; margin-bottom: 42px; }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(30px, 7vw, 46px);
    font-weight: 800;
    letter-spacing: .08em;
    background: linear-gradient(100deg, #ffffff 0%, #c9b8ff 38%, #7ee7ff 72%, #ffffff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 6px 26px rgba(124, 92, 255, .55));
  }

  .subtitle {
    margin: 0;
    font-size: 14px;
    letter-spacing: .18em;
    color: var(--text-dim);
  }

  /* ============ 游戏按钮区（每行 2 个） ============ */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .game-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 30px 14px 26px;
    min-height: 152px;
    border-radius: 20px;
    text-decoration: none;
    color: var(--text);
    background: linear-gradient(160deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03));
    border: 1px solid var(--card-border);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .14);
    transition: transform .28s cubic-bezier(.2, .8, .3, 1),
                box-shadow .28s, border-color .28s;
    overflow: hidden;
  }

  /* 悬停流光 */
  .game-card::after {
    content: "";
    position: absolute;
    inset: -60% -60% auto -60%;
    height: 140%;
    background: linear-gradient(115deg, transparent 35%,
                rgba(255, 255, 255, .16) 50%, transparent 65%);
    transform: translateX(-120%);
    transition: transform .7s ease;
    pointer-events: none;
    z-index: 0;
  }
  .game-card:hover::after { transform: translateX(120%); }

  .game-card:hover {
    transform: translateY(-6px);
    border-color: rgba(180, 160, 255, .55);
    box-shadow: 0 18px 42px rgba(0, 0, 0, .45),
                0 0 0 1px rgba(180, 160, 255, .25),
                0 0 34px rgba(124, 92, 255, .45);
  }
  .game-card:active { transform: translateY(-2px) scale(.99); }
  .game-card:focus-visible { outline: 2px solid #7ee7ff; outline-offset: 4px; }

  .card-icon,
  .card-name { position: relative; z-index: 1; }

  .card-icon {
    font-size: 34px;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .45));
  }

  .card-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .05em;
    text-align: center;
  }

  /* ============ 页脚 ============ */
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--text-dim);
  }

  /* ============ 小屏适配（仍保持每行 2 个） ============ */
  @media (max-width: 420px) {
    body { padding: 34px 14px 40px; }
    .game-grid { gap: 12px; }
    .game-card {
      padding: 22px 10px;
      min-height: 132px;
      border-radius: 16px;
      gap: 10px;
    }
    .card-icon { font-size: 28px; }
    .card-name { font-size: 15px; }
    .subtitle { font-size: 13px; letter-spacing: .12em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob-1, .blob-2 { animation: none; }
    .game-card, .game-card::after { transition: none; }
  }
</style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="container">
    <header>
      <h1>小游戏合集</h1>
      <p class="subtitle">挑一个，随时开玩</p>
    </header>

    <nav class="game-grid" aria-label="游戏列表">
      
      <!-- 游戏 1：跳转到 Chromirage.html -->
      <a class="game-card" href="Chromirage.html">
        <span class="card-icon">🌈</span>
        <span class="card-name">缤纷叠影</span>
      </a>

      <!-- 游戏 2：跳转到 FlashMem.html -->
      <a class="game-card" href="FlashMem.html">
        <span class="card-icon">🎮</span>
        <span class="card-name">游戏二</span>
      </a>

      <!-- 以后新增游戏：复制上面任意一个 <a>，改 href、图标和名字即可 -->
      
    </nav>

    <footer>共 2 款小游戏 · 持续更新中</footer>
  </main>
</body>
</html>
