<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>缤纷叠影 - 完全版</title>
    <style>
        :root {
            --bg-color: #1a1c2c;
            --panel-bg: #282a40;
            --primary-color: #5bc0de;
            --text-color: #ffffff;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            background-image: radial-gradient(circle at 50% 0%, #2a2d4d 0%, #1a1c2c 100%);
            overflow-x: hidden;
        }

        /* --- 顶部栏与标题 --- */
        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin-bottom: 5px;
            padding: 0 10px;
        }

        .game-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            flex-grow: 1;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 200;
        }
        .icon-btn:active {
            transform: scale(0.9);
        }

        /* 灯泡激活状态 */
        #hint-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        /* 问号按钮 */
        #help-btn {
            color: #5bc0de;
            border-color: rgba(91, 192, 222, 0.4);
        }

        .timer-display {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- 状态栏 --- */
        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #ccc;
        }
        .status-bar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- 游戏主区域 --- */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        /* 盘面上方的工具栏 */
        .board-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            margin-bottom: 5px;
        }

        .history-controls {
            display: flex;
            gap: 10px;
        }

        .small-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .small-icon-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .small-icon-btn:not(:disabled):active {
            background: rgba(255, 255, 255, 0.2);
        }

        .board-label {
            font-size: 13px;
            color: #aaa;
            flex-grow: 1;
            text-align: right;
            padding-right: 5px;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            touch-action: none;
        }

        .board-wrapper.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(91, 192, 222, 0.3);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        .target-wrapper {
            width: 55%;
            aspect-ratio: 1 / 1;
            position: relative;
            margin-top: 20px;
        }

        /* --- 底部按钮 --- */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            border: none;
            color: #333;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .small-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .small-btn:active { background: rgba(255, 255, 255, 0.2); }

        /* --- 遮罩与弹窗 --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 150;
            display: none;
            cursor: pointer;
        }
        .overlay.show { display: block; }

        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 22, 37, 0.95);
            padding: 25px 30px;
            border-radius: 16px;
            text-align: center;
            z-index: 300;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 50px rgba(91, 192, 222, 0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 90%;
            width: 320px;
        }
        .modal.show { transform: translate(-50%, -50%) scale(1); }
        .modal h2 { color: var(--primary-color); font-size: 20px; margin-bottom: 5px; }
        .modal p { font-size: 14px; color: #ccc; line-height: 1.5; text-align: left; margin-bottom: 10px;}
        
        .toast {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="icon-btn" id="help-btn" title="查看规则">❓</div>
        <div class="game-title">缤纷叠影</div>
        <div class="icon-btn" id="hint-btn" title="进入/退出演示模式">💡</div>
    </div>
    
    <!-- 倒计时 -->
    <div class="timer-display">剩余时间: <span id="timer">--:--</span></div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span>🔄 折叠: <span id="fold-count">0</span> / <span id="target-folds">4</span>次</span>
        <span>🎯 状态: <span id="status-text" style="color:#5bc0de;">进行中</span></span>
    </div>

    <!-- 游戏区域 -->
    <div class="game-container">
        
        <!-- 盘面上方操作栏 -->
        <div class="board-header">
            <div class="history-controls">
                <button class="small-icon-btn" id="undo-btn" title="撤回" disabled>↩️</button>
                <button class="small-icon-btn" id="redo-btn" title="前进" disabled>↪️</button>
            </div>
            <div class="board-label">当前盘面</div>
        </div>

        <div class="board-wrapper active">
            <canvas id="game-canvas" width="600" height="600"></canvas>
        </div>

        <div class="board-wrapper target-wrapper">
            <div class="label" style="position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:13px; color:#aaa; white-space:nowrap;">目标图形</div>
            <canvas id="target-canvas" width="600" height="600"></canvas>
        </div>

        <div class="controls">
            <button class="small-btn" id="restart-btn">🔄 重新开始</button>
            <button class="small-btn" id="cheat-btn">✨ 随机折叠</button>
        </div>

        <!-- 胜利弹窗 -->
        <div class="modal" id="victory-popup">
            <h2>🎉 挑战成功！</h2>
            <div>
                <button class="small-btn" style="padding: 10px 20px;" onclick="closeVictory(true)">返回复盘</button>
                <button class="btn" style="margin-left: 10px; padding: 10px 20px;" onclick="closeVictory(false)">下一题</button>
            </div>
        </div>
        
        <!-- 规则弹窗 -->
        <div class="modal" id="rules-popup">
            <h2>📜 游戏规则</h2>
            <p>
                1. 沿着网格上的任意直线（横向、纵向、主对角、副对角）拖动盘面即可进行折叠。<br>
                2. 拖动时会显示白色虚线折痕，松手后，将一侧沿折痕覆盖到另一侧。<br>
                3. 目标是将当前的彩色盘面折叠成下方“目标图形”的样子。<br>
                4. 点击右上角 💡 可以进入演示模式，全屏点击可以查看答案步骤。<br>
                5. 点击左上角 ❓ 随时查看此规则。
            </p>
            <button class="btn" onclick="closeRules()">我知道了</button>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 游戏配置
        const N = 8;
        const COLORS = [
            '#FF8C00', '#8A2BE2', '#DC143C', '#FFD700', 
            '#87CEEB', '#00008B', '#FF69B4', '#32CD32'
        ];

        let startGrid = [];
        let targetGrid = [];
        let currentGrid = [];
        
        // 历史记录机制
        let stateHistory = []; 
        let currentStateIndex = -1;
        
        let foldCount = 0;
        let targetFoldCount = 4;
        let isVictory = false;
        
        // 演示模式相关
        let isHintMode = false;
        let solutionSteps = []; 
        let demoStepIndex = 0;
        let isAnimating = false;
        
        // 拖拽状态
        let isDragging = false;
        let startPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let dragAction = null;

        // DOM 元素
        const gameCanvas = document.getElementById('game-canvas');
        const ctx = gameCanvas.getContext('2d');
        const targetCanvas = document.getElementById('target-canvas');
        const tCtx = targetCanvas.getContext('2d');
        const toastEl = document.getElementById('toast');
        const hintBtn = document.getElementById('hint-btn');
        const overlay = document.getElementById('overlay');
        
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const restartBtn = document.getElementById('restart-btn');
        const cheatBtn = document.getElementById('cheat-btn');
        const helpBtn = document.getElementById('help-btn');
        const rulesPopup = document.getElementById('rules-popup');

        // --- 核心算法 ---
        function createRandomGrid() {
            const grid = [];
            for (let x = 0; x < N; x++) {
                grid[x] = [];
                for (let y = 0; y < N; y++) {
                    grid[x][y] = [
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)]
                    ];
                }
            }
            return grid;
        }

        function deepCopyGrid(grid) {
            return JSON.parse(JSON.stringify(grid));
        }

        function isGridEqual(g1, g2) {
            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        if (g1[x][y][i] !== g2[x][y][i]) return false;
                    }
                }
            }
            return true;
        }

        function mirrorColors(colors, axis) {
            if (axis === 'V') return [colors[0], colors[3], colors[2], colors[1]];
            if (axis === 'H') return [colors[2], colors[1], colors[0], colors[3]];
            if (axis === 'M') return [colors[3], colors[2], colors[1], colors[0]];
            if (axis === 'A') return [colors[1], colors[0], colors[3], colors[2]];
            return colors;
        }

        function applyFold(grid, action) {
            const newGrid = deepCopyGrid(grid);
            const { axis, k, side } = action;

            if (axis === 'V') {
                if (side === 'left') {
                    for (let x = 0; x < k; x++) {
                        let x2 = 2 * k - x - 1;
                        if (x2 >= 0 && x2 < N) for (let y = 0; y < N; y++) newGrid[x2][y] = mirrorColors(grid[x][y], 'V');
                    }
                } else {
                    for (let x = k; x < N; x++) {
                        let x2 = 2 * k - x - 1;
                        if (x2 >= 0 && x2 < N) for (let y = 0; y < N; y++) newGrid[x2][y] = mirrorColors(grid[x][y], 'V');
                    }
                }
            } else if (axis === 'H') {
                if (side === 'top') {
                    for (let y = 0; y < k; y++) {
                        let y2 = 2 * k - y - 1;
                        if (y2 >= 0 && y2 < N) for (let x = 0; x < N; x++) newGrid[x][y2] = mirrorColors(grid[x][y], 'H');
                    }
                } else {
                    for (let y = k; y < N; y++) {
                        let y2 = 2 * k - y - 1;
                        if (y2 >= 0 && y2 < N) for (let x = 0; x < N; x++) newGrid[x][y2] = mirrorColors(grid[x][y], 'H');
                    }
                }
            } else if (axis === 'M') {
                if (side === 'top-left') {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (y - x < k) {
                                let x2 = y - k, y2 = x + k;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'M');
                            }
                        }
                    }
                } else {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (y - x > k) {
                                let x2 = y - k, y2 = x + k;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'M');
                            }
                        }
                    }
                }
            } else if (axis === 'A') {
                if (side === 'bottom-left') {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (x + y < k) {
                                let x2 = k - y - 1, y2 = k - x - 1;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'A');
                            }
                        }
                    }
                } else {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (x + y > k) {
                                let x2 = k - y - 1, y2 = k - x - 1;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'A');
                            }
                        }
                    }
                }
            }
            return newGrid;
        }

        function generateTargetGrid(grid, folds) {
            let tempGrid = deepCopyGrid(grid);
            solutionSteps = [];
            
            for (let i = 0; i < folds; i++) {
                let action = null;
                let currentTemp = deepCopyGrid(tempGrid);
                
                for (let attempt = 0; attempt < 10; attempt++) {
                    const axes = ['V', 'H', 'M', 'A'];
                    const axis = axes[Math.floor(Math.random() * axes.length)];
                    
                    if (axis === 'V' || axis === 'H') {
                        const k = Math.floor(Math.random() * (N - 1)) + 1;
                        const side = Math.random() > 0.5 ? (axis === 'V' ? 'left' : 'top') : (axis === 'V' ? 'right' : 'bottom');
                        action = { axis, k, side };
                    } else if (axis === 'M') {
                        const k = Math.floor(Math.random() * (2 * N - 1)) - (N - 1);
                        const side = Math.random() > 0.5 ? 'top-left' : 'bottom-right';
                        action = { axis, k, side };
                    } else if (axis === 'A') {
                        const k = Math.floor(Math.random() * (2 * N - 1)) + 1;
                        const side = Math.random() > 0.5 ? 'bottom-left' : 'top-right';
                        action = { axis, k, side };
                    }
                    
                    tempGrid = applyFold(tempGrid, action);
                    if (!isGridEqual(tempGrid, currentTemp)) {
                        solutionSteps.push(action);
                        break;
                    }
                }
            }
            return tempGrid;
        }

        // --- 历史记录管理 ---
        function pushState(newGrid) {
            // 如果当前不是最新状态，截断后面的记录
            if (currentStateIndex < stateHistory.length - 1) {
                stateHistory = stateHistory.slice(0, currentStateIndex + 1);
            }
            stateHistory.push(deepCopyGrid(newGrid));
            currentStateIndex = stateHistory.length - 1;
            
            foldCount = currentStateIndex;
            document.getElementById('fold-count').innerText = foldCount;
            
            updateHistoryButtons();
            checkVictory();
            renderGame();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = (currentStateIndex <= 0) || isVictory || isHintMode;
            redoBtn.disabled = (currentStateIndex >= stateHistory.length - 1) || isVictory || isHintMode;
        }

        function goUndo() {
            if (currentStateIndex > 0) {
                currentStateIndex--;
                currentGrid = deepCopyGrid(stateHistory[currentStateIndex]);
                foldCount = currentStateIndex;
                document.getElementById('fold-count').innerText = foldCount;
                updateHistoryButtons();
                renderGame();
            }
        }

        function goRedo() {
            if (currentStateIndex < stateHistory.length - 1) {
                currentStateIndex++;
                currentGrid = deepCopyGrid(stateHistory[currentStateIndex]);
                foldCount = currentStateIndex;
                document.getElementById('fold-count').innerText = foldCount;
                updateHistoryButtons();
                renderGame();
            }
        }

        // --- 绘制逻辑 ---
        function drawBoard(ctx, grid) {
            const width = ctx.canvas.width;
            const cellSize = width / N;
            ctx.clearRect(0, 0, width, width);

            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    const px = x * cellSize, py = y * cellSize;
                    const cx = px + cellSize / 2, cy = py + cellSize / 2;
                    const colors = grid[x][y];

                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[0]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py); ctx.lineTo(px + cellSize, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[1]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py + cellSize); ctx.lineTo(px, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[2]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px, py + cellSize); ctx.lineTo(px, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[3]; ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py + cellSize);
                    ctx.moveTo(px + cellSize, py); ctx.lineTo(px, py + cellSize);
                    ctx.stroke();
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px, py, cellSize, cellSize);
                }
            }
        }

        function drawHighlightLine(ctx, action) {
            if (!action) return;
            const width = ctx.canvas.width;
            const cellSize = width / N;

            ctx.beginPath();
            ctx.strokeStyle = '#FF4500';
            ctx.lineWidth = 6;
            ctx.setLineDash([10, 8]);
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#FF4500';

            if (action.axis === 'V') {
                let x = action.k * cellSize; ctx.moveTo(x, 0); ctx.lineTo(x, width);
            } else if (action.axis === 'H') {
                let y = action.k * cellSize; ctx.moveTo(0, y); ctx.lineTo(width, y);
            } else if (action.axis === 'M') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = (N - action.k) * cellSize, p2y = width;
                if (action.k < 0) { p1x = -action.k * cellSize; p1y = 0; p2x = width; p2y = (N + action.k) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            } else if (action.axis === 'A') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = action.k * cellSize, p2y = 0;
                if (action.k > N) { p1x = (action.k - N) * cellSize; p1y = width; p2x = width; p2y = (action.k - N) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
        }

        function drawDragHintLine(ctx, action) {
            if (!action) return;
            const width = ctx.canvas.width;
            const cellSize = width / N;

            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);

            if (action.axis === 'V') {
                let x = action.k * cellSize; ctx.moveTo(x, 0); ctx.lineTo(x, width);
            } else if (action.axis === 'H') {
                let y = action.k * cellSize; ctx.moveTo(0, y); ctx.lineTo(width, y);
            } else if (action.axis === 'M') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = (N - action.k) * cellSize, p2y = width;
                if (action.k < 0) { p1x = -action.k * cellSize; p1y = 0; p2x = width; p2y = (N + action.k) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            } else if (action.axis === 'A') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = action.k * cellSize, p2y = 0;
                if (action.k > N) { p1x = (action.k - N) * cellSize; p1y = width; p2x = width; p2y = (action.k - N) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function renderGame() {
            drawBoard(ctx, currentGrid);
            if (isDragging && dragAction) {
                drawDragHintLine(ctx, dragAction);
            }
        }

        // --- 拖拽交互 ---
        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
            } else if (evt.changedTouches && evt.changedTouches.length > 0) {
                clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY;
            }
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }

        function getDragAction(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            if (Math.hypot(dx, dy) < 30) return null;

            const cellSize = gameCanvas.width / N;
            const projV = Math.abs(dx), projH = Math.abs(dy);
            const projM = Math.abs(dx + dy) / Math.SQRT2;
            const projA = Math.abs(dx - dy) / Math.SQRT2;

            let maxVal = projV, maxAxis = 'V';
            if (projH > maxVal) { maxVal = projH; maxAxis = 'H'; }
            if (projM > maxVal) { maxVal = projM; maxAxis = 'M'; }
            if (projA > maxVal) { maxVal = projA; maxAxis = 'A'; }

            if (maxAxis === 'V') {
                let k = Math.round(endX / cellSize);
                if (k <= 0 || k >= N) return null;
                return { axis: 'V', k: k, side: dx > 0 ? 'left' : 'right' };
            } else if (maxAxis === 'H') {
                let k = Math.round(endY / cellSize);
                if (k <= 0 || k >= N) return null;
                return { axis: 'H', k: k, side: dy > 0 ? 'top' : 'bottom' };
            } else if (maxAxis === 'M') {
                let k = Math.round((endY - endX) / cellSize);
                return { axis: 'M', k: k, side: (dx + dy) > 0 ? 'top-left' : 'bottom-right' };
            } else if (maxAxis === 'A') {
                let k = Math.round((endY + endX) / cellSize);
                return { axis: 'A', k: k, side: (dx - dy) > 0 ? 'bottom-left' : 'top-right' };
            }
            return null;
        }

        function startDrag(e) {
            if (isVictory || isHintMode || isAnimating) return;
            e.preventDefault();
            isDragging = true;
            const pos = getMousePos(gameCanvas, e);
            startPos = pos; currentPos = pos;
            dragAction = null;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            currentPos = getMousePos(gameCanvas, e);
            dragAction = getDragAction(startPos.x, startPos.y, currentPos.x, currentPos.y);
            renderGame();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            if (dragAction) {
                const nextGrid = applyFold(currentGrid, dragAction);
                pushState(nextGrid);
            } else {
                renderGame();
            }
            dragAction = null;
        }

        gameCanvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);
        gameCanvas.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('touchend', endDrag);

        // --- 演示模式 ---
        let clickTimer = null;
        
        hintBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isAnimating || isVictory) return;

            isHintMode = !isHintMode;
            if (isHintMode) {
                hintBtn.classList.add('active');
                overlay.classList.add('show');
                showToast("进入演示模式 (单击下一步, 双击上一步)");
                
                // 演示模式强制从初始状态开始
                currentStateIndex = 0;
                currentGrid = deepCopyGrid(startGrid);
                stateHistory = [deepCopyGrid(startGrid)]; // 重置历史记录
                foldCount = 0;
                document.getElementById('fold-count').innerText = 0;
                
                updateHistoryButtons();
                renderGame();
            } else {
                hintBtn.classList.remove('active');
                overlay.classList.remove('show');
                showToast("退出演示模式");
                updateHistoryButtons();
            }
        });

        overlay.addEventListener('click', (e) => {
            if (!isHintMode || isAnimating) return;

            if (clickTimer !== null) {
                clearTimeout(clickTimer);
                clickTimer = null;
                goUndo(); // 双击相当于撤回
            } else {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    demoNextStep();
                }, 250);
            }
        });

        function demoNextStep() {
            const nextIndex = currentStateIndex + 1;
            if (nextIndex >= solutionSteps.length) {
                showToast("已经是最后一步了");
                return;
            }

            isAnimating = true;
            const action = solutionSteps[nextIndex];

            drawBoard(ctx, currentGrid);
            drawHighlightLine(ctx, action);

            setTimeout(() => {
                const nextGrid = applyFold(currentGrid, action);
                pushState(nextGrid);
                isAnimating = false;
                showToast(`演示第 ${currentStateIndex} / ${solutionSteps.length} 步`);
            }, 1000);
        }

        // --- 控制逻辑 ---
        function initGame() {
            isVictory = false;
            isDragging = false;
            dragAction = null;
            isHintMode = false;
            isAnimating = false;
            foldCount = 0;
            
            hintBtn.classList.remove('active');
            overlay.classList.remove('show');
            document.getElementById('victory-popup').classList.remove('show');
            rulesPopup.classList.remove('show');

            targetFoldCount = Math.floor(Math.random() * 3) + 4;
            document.getElementById('target-folds').innerText = targetFoldCount;
            document.getElementById('status-text').innerText = '进行中';
            document.getElementById('status-text').style.color = '#5bc0de';

            startGrid = createRandomGrid();
            targetGrid = generateTargetGrid(startGrid, targetFoldCount);
            
            if (isGridEqual(startGrid, targetGrid)) {
                return initGame();
            }
            
            // 初始化历史记录
            stateHistory = [deepCopyGrid(startGrid)];
            currentStateIndex = 0;
            currentGrid = deepCopyGrid(startGrid);
            
            document.getElementById('fold-count').innerText = 0;
            updateHistoryButtons();
            renderGame();
            drawBoard(tCtx, targetGrid);
            startTimer();
        }

        function checkVictory() {
            if (isGridEqual(currentGrid, targetGrid)) {
                if (isVictory) return;
                isVictory = true;
                document.getElementById('status-text').innerText = '已完成';
                document.getElementById('status-text').style.color = '#32CD32';
                document.getElementById('victory-popup').classList.add('show');
                stopTimer();
                updateHistoryButtons(); // 禁用撤回/前进
                
                if (isHintMode) {
                    hintBtn.classList.remove('active');
                    overlay.classList.remove('show');
                    isHintMode = false;
                }
            }
        }

        function closeVictory(backToReview) {
            document.getElementById('victory-popup').classList.remove('show');
            if (backToReview) {
                isVictory = false; 
                document.getElementById('status-text').innerText = '复盘模式';
                document.getElementById('status-text').style.color = '#FFD700';
                // 复盘模式下允许撤回和前进
                updateHistoryButtons();
            } else {
                initGame();
            }
        }

        function closeRules() {
            rulesPopup.classList.remove('show');
        }

        function showToast(msg) {
            toastEl.innerText = msg;
            toastEl.classList.add('show');
            setTimeout(() => { toastEl.classList.remove('show'); }, 2000);
        }

        // 事件绑定
        undoBtn.addEventListener('click', goUndo);
        redoBtn.addEventListener('click', goRedo);
        restartBtn.addEventListener('click', initGame);
        helpBtn.addEventListener('click', () => rulesPopup.classList.add('show'));
        
        cheatBtn.addEventListener('click', () => {
            if (isVictory || isDragging || isHintMode || isAnimating) return;
            const axes = ['V', 'H', 'M', 'A'];
            const axis = axes[Math.floor(Math.random() * axes.length)];
            let action;
            
            if (axis === 'V') action = { axis, k: Math.floor(Math.random()*(N-1))+1, side: Math.random()>0.5?'left':'right' };
            if (axis === 'H') action = { axis, k: Math.floor(Math.random()*(N-1))+1, side: Math.random()>0.5?'top':'bottom' };
            if (axis === 'M') action = { axis, k: Math.floor(Math.random()*(2*N-1))-(N-1), side: Math.random()>0.5?'top-left':'bottom-right' };
            if (axis === 'A') action = { axis, k: Math.floor(Math.random()*(2*N-1))+1, side: Math.random()>0.5?'bottom-left':'top-right' };
            
            const nextGrid = applyFold(currentGrid, action);
            pushState(nextGrid);
        });

        // --- 计时器 ---
        let timeLeft = 300;
        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 300;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isVictory) {
                        document.getElementById('status-text').innerText = '时间到';
                        document.getElementById('status-text').style.color = '#DC143C';
                        isVictory = true;
                        updateHistoryButtons();
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        // 启动游戏
        initGame();
    </script>
</body>
</html>
