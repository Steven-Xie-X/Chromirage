<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>缤纷叠影 - 演示与复盘版</title>
    <style>
        :root {
            --bg-color: #1a1c2c;
            --panel-bg: #282a40;
            --primary-color: #5bc0de;
            --text-color: #ffffff;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            background-image: radial-gradient(circle at 50% 0%, #2a2d4d 0%, #1a1c2c 100%);
            overflow: hidden;
            position: relative;
        }

        /* 右上角灯泡按钮 */
        .hint-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 200;
        }
        .hint-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .timer {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #ccc;
        }

        .status-bar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            touch-action: none;
        }

        .board-wrapper.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(91, 192, 222, 0.3);
        }

        .label {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        .target-wrapper {
            width: 50%;
            aspect-ratio: 1 / 1;
            position: relative;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            border: none;
            color: #333;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }

        .small-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .small-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }
        .small-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* 胜利弹窗 */
        .victory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 22, 37, 0.95);
            padding: 25px 30px;
            border-radius: 16px;
            text-align: center;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 50px rgba(91, 192, 222, 0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .victory.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .victory h2 {
            color: var(--primary-color);
            font-size: 20px;
        }
        
        /* 演示模式遮罩，用于拦截全屏点击，防止误触 */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 150;
            display: none;
            cursor: pointer;
        }
        .overlay.show {
            display: block;
        }

        .toast {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <!-- 查看答案按钮 -->
    <div class="hint-btn" id="hint-btn" title="进入/退出演示模式">💡</div>

    <div class="header">
        <div class="title">缤纷叠影</div>
        <div class="timer">剩余: <span id="timer">--:--</span></div>
    </div>

    <div class="status-bar">
        <span>🔄 折叠: <span id="fold-count">0</span> / <span id="target-folds">4</span>次</span>
        <span>🎯 状态: <span id="status-text" style="color:#5bc0de;">进行中</span></span>
    </div>

    <div class="game-container" id="game-container">
        <div class="board-wrapper active">
            <div class="label">当前盘面 (全网格自由折叠)</div>
            <canvas id="game-canvas" width="600" height="600"></canvas>
        </div>

        <div class="board-wrapper target-wrapper">
            <div class="label">目标图形</div>
            <canvas id="target-canvas" width="600" height="600"></canvas>
        </div>

        <div class="controls">
            <button class="small-btn" onclick="initGame()">🔄 重新开始</button>
            <button class="small-btn" id="undo-btn" onclick="undo()" disabled>↩️ 撤回</button>
            <button class="small-btn" onclick="cheatFold()">✨ 自动折叠</button>
        </div>

        <div class="victory" id="victory-popup">
            <h2>🎉 挑战成功！</h2>
            <div>
                <button class="small-btn" style="padding: 10px 20px;" onclick="closeVictory(true)">返回复盘</button>
                <button class="btn" style="margin-left: 10px; padding: 10px 20px;" onclick="closeVictory(false)">下一题</button>
            </div>
        </div>
        
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 游戏基础配置
        const N = 8;
        const COLORS = [
            '#FF8C00', '#8A2BE2', '#DC143C', '#FFD700', 
            '#87CEEB', '#00008B', '#FF69B4', '#32CD32'
        ];

        let startGrid = [];
        let targetGrid = [];
        let currentGrid = [];
        let historyStack = [];
        let foldCount = 0;
        let targetFoldCount = 4;
        let isVictory = false;
        
        // 演示相关
        let isHintMode = false;
        let solutionSteps = []; 
        let demoStepIndex = 0;
        let isAnimating = false;
        
        // 交互状态
        let isDragging = false;
        let startPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let dragAction = null;

        const gameCanvas = document.getElementById('game-canvas');
        const ctx = gameCanvas.getContext('2d');
        const targetCanvas = document.getElementById('target-canvas');
        const tCtx = targetCanvas.getContext('2d');
        const toastEl = document.getElementById('toast');
        const hintBtn = document.getElementById('hint-btn');
        const overlay = document.getElementById('overlay');

        // --- 核心算法 ---
        function createRandomGrid() {
            const grid = [];
            for (let x = 0; x < N; x++) {
                grid[x] = [];
                for (let y = 0; y < N; y++) {
                    grid[x][y] = [
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)],
                        COLORS[Math.floor(Math.random() * COLORS.length)]
                    ];
                }
            }
            return grid;
        }

        function deepCopyGrid(grid) {
            return JSON.parse(JSON.stringify(grid));
        }

        function isGridEqual(g1, g2) {
            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        if (g1[x][y][i] !== g2[x][y][i]) return false;
                    }
                }
            }
            return true;
        }

        function mirrorColors(colors, axis) {
            if (axis === 'V') return [colors[0], colors[3], colors[2], colors[1]];
            if (axis === 'H') return [colors[2], colors[1], colors[0], colors[3]];
            if (axis === 'M') return [colors[3], colors[2], colors[1], colors[0]];
            if (axis === 'A') return [colors[1], colors[0], colors[3], colors[2]];
            return colors;
        }

        function applyFold(grid, action) {
            const newGrid = deepCopyGrid(grid);
            const { axis, k, side } = action;

            if (axis === 'V') {
                if (side === 'left') {
                    for (let x = 0; x < k; x++) {
                        let x2 = 2 * k - x - 1;
                        if (x2 >= 0 && x2 < N) for (let y = 0; y < N; y++) newGrid[x2][y] = mirrorColors(grid[x][y], 'V');
                    }
                } else {
                    for (let x = k; x < N; x++) {
                        let x2 = 2 * k - x - 1;
                        if (x2 >= 0 && x2 < N) for (let y = 0; y < N; y++) newGrid[x2][y] = mirrorColors(grid[x][y], 'V');
                    }
                }
            } else if (axis === 'H') {
                if (side === 'top') {
                    for (let y = 0; y < k; y++) {
                        let y2 = 2 * k - y - 1;
                        if (y2 >= 0 && y2 < N) for (let x = 0; x < N; x++) newGrid[x][y2] = mirrorColors(grid[x][y], 'H');
                    }
                } else {
                    for (let y = k; y < N; y++) {
                        let y2 = 2 * k - y - 1;
                        if (y2 >= 0 && y2 < N) for (let x = 0; x < N; x++) newGrid[x][y2] = mirrorColors(grid[x][y], 'H');
                    }
                }
            } else if (axis === 'M') {
                if (side === 'top-left') {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (y - x < k) {
                                let x2 = y - k, y2 = x + k;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'M');
                            }
                        }
                    }
                } else {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (y - x > k) {
                                let x2 = y - k, y2 = x + k;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'M');
                            }
                        }
                    }
                }
            } else if (axis === 'A') {
                if (side === 'bottom-left') {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (x + y < k) {
                                let x2 = k - y - 1, y2 = k - x - 1;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'A');
                            }
                        }
                    }
                } else {
                    for (let x = 0; x < N; x++) {
                        for (let y = 0; y < N; y++) {
                            if (x + y > k) {
                                let x2 = k - y - 1, y2 = k - x - 1;
                                if (x2 >= 0 && x2 < N && y2 >= 0 && y2 < N) newGrid[x2][y2] = mirrorColors(grid[x][y], 'A');
                            }
                        }
                    }
                }
            }
            return newGrid;
        }

        function generateTargetGrid(grid, folds) {
            let tempGrid = deepCopyGrid(grid);
            solutionSteps = [];
            
            for (let i = 0; i < folds; i++) {
                let action = null;
                let currentTemp = deepCopyGrid(tempGrid);
                
                for (let attempt = 0; attempt < 10; attempt++) {
                    const axes = ['V', 'H', 'M', 'A'];
                    const axis = axes[Math.floor(Math.random() * axes.length)];
                    
                    if (axis === 'V' || axis === 'H') {
                        const k = Math.floor(Math.random() * (N - 1)) + 1;
                        const side = Math.random() > 0.5 ? (axis === 'V' ? 'left' : 'top') : (axis === 'V' ? 'right' : 'bottom');
                        action = { axis, k, side };
                    } else if (axis === 'M') {
                        const k = Math.floor(Math.random() * (2 * N - 1)) - (N - 1);
                        const side = Math.random() > 0.5 ? 'top-left' : 'bottom-right';
                        action = { axis, k, side };
                    } else if (axis === 'A') {
                        const k = Math.floor(Math.random() * (2 * N - 1)) + 1;
                        const side = Math.random() > 0.5 ? 'bottom-left' : 'top-right';
                        action = { axis, k, side };
                    }
                    
                    tempGrid = applyFold(tempGrid, action);
                    if (!isGridEqual(tempGrid, currentTemp)) {
                        solutionSteps.push(action);
                        break;
                    }
                }
            }
            return tempGrid;
        }

        function calculateGridFromSteps(stepsCount) {
            let temp = deepCopyGrid(startGrid);
            for (let i = 0; i < stepsCount; i++) {
                temp = applyFold(temp, solutionSteps[i]);
            }
            return temp;
        }

        // --- 绘制逻辑 ---
        function drawBoard(ctx, grid) {
            const width = ctx.canvas.width;
            const cellSize = width / N;
            ctx.clearRect(0, 0, width, width);

            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    const px = x * cellSize, py = y * cellSize;
                    const cx = px + cellSize / 2, cy = py + cellSize / 2;
                    const colors = grid[x][y];

                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[0]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py); ctx.lineTo(px + cellSize, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[1]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py + cellSize); ctx.lineTo(px, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[2]; ctx.fill();
                    
                    ctx.beginPath(); ctx.moveTo(px, py + cellSize); ctx.lineTo(px, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = colors[3]; ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py + cellSize);
                    ctx.moveTo(px + cellSize, py); ctx.lineTo(px, py + cellSize);
                    ctx.stroke();
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(px, py, cellSize, cellSize);
                }
            }
        }

        // 绘制折痕高亮指示线 (带红色闪烁效果)
        function drawHighlightLine(ctx, action) {
            if (!action) return;
            const width = ctx.canvas.width;
            const cellSize = width / N;

            ctx.beginPath();
            ctx.strokeStyle = '#FF4500'; // 橘红色高亮
            ctx.lineWidth = 6;
            ctx.setLineDash([10, 8]);
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#FF4500';

            if (action.axis === 'V') {
                let x = action.k * cellSize;
                ctx.moveTo(x, 0); ctx.lineTo(x, width);
            } else if (action.axis === 'H') {
                let y = action.k * cellSize;
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            } else if (action.axis === 'M') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = (N - action.k) * cellSize, p2y = width;
                if (action.k < 0) { p1x = -action.k * cellSize; p1y = 0; p2x = width; p2y = (N + action.k) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            } else if (action.axis === 'A') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = action.k * cellSize, p2y = 0;
                if (action.k > N) { p1x = (action.k - N) * cellSize; p1y = width; p2x = width; p2y = (action.k - N) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
        }

        // 手动拖拽时的白色虚线
        function drawDragHintLine(ctx, action) {
            if (!action) return;
            const width = ctx.canvas.width;
            const cellSize = width / N;

            ctx.beginPath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);

            if (action.axis === 'V') {
                let x = action.k * cellSize; ctx.moveTo(x, 0); ctx.lineTo(x, width);
            } else if (action.axis === 'H') {
                let y = action.k * cellSize; ctx.moveTo(0, y); ctx.lineTo(width, y);
            } else if (action.axis === 'M') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = (N - action.k) * cellSize, p2y = width;
                if (action.k < 0) { p1x = -action.k * cellSize; p1y = 0; p2x = width; p2y = (N + action.k) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            } else if (action.axis === 'A') {
                let p1x = 0, p1y = action.k * cellSize;
                let p2x = action.k * cellSize, p2y = 0;
                if (action.k > N) { p1x = (action.k - N) * cellSize; p1y = width; p2x = width; p2y = (action.k - N) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function renderGame() {
            drawBoard(ctx, currentGrid);
            if (isDragging && dragAction) {
                drawDragHintLine(ctx, dragAction);
            }
        }

        // --- 交互事件 (手动拖拽) ---
        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
            } else if (evt.changedTouches && evt.changedTouches.length > 0) {
                clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY;
            }
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }

        function getDragAction(startX, startY, endX, endY) {
            const dx = endX - startX;
            const dy = endY - startY;
            if (Math.hypot(dx, dy) < 30) return null;

            const cellSize = gameCanvas.width / N;
            const projV = Math.abs(dx), projH = Math.abs(dy);
            const projM = Math.abs(dx + dy) / Math.SQRT2;
            const projA = Math.abs(dx - dy) / Math.SQRT2;

            let maxVal = projV, maxAxis = 'V';
            if (projH > maxVal) { maxVal = projH; maxAxis = 'H'; }
            if (projM > maxVal) { maxVal = projM; maxAxis = 'M'; }
            if (projA > maxVal) { maxVal = projA; maxAxis = 'A'; }

            if (maxAxis === 'V') {
                let k = Math.round(endX / cellSize);
                if (k <= 0 || k >= N) return null;
                return { axis: 'V', k: k, side: dx > 0 ? 'left' : 'right' };
            } else if (maxAxis === 'H') {
                let k = Math.round(endY / cellSize);
                if (k <= 0 || k >= N) return null;
                return { axis: 'H', k: k, side: dy > 0 ? 'top' : 'bottom' };
            } else if (maxAxis === 'M') {
                let k = Math.round((endY - endX) / cellSize);
                return { axis: 'M', k: k, side: (dx + dy) > 0 ? 'top-left' : 'bottom-right' };
            } else if (maxAxis === 'A') {
                let k = Math.round((endY + endX) / cellSize);
                return { axis: 'A', k: k, side: (dx - dy) > 0 ? 'bottom-left' : 'top-right' };
            }
            return null;
        }

        function startDrag(e) {
            if (isVictory || isHintMode || isAnimating) return;
            e.preventDefault();
            isDragging = true;
            const pos = getMousePos(gameCanvas, e);
            startPos = pos;
            currentPos = pos;
            dragAction = null;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            currentPos = getMousePos(gameCanvas, e);
            dragAction = getDragAction(startPos.x, startPos.y, currentPos.x, currentPos.y);
            renderGame();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            if (dragAction) {
                historyStack.push(deepCopyGrid(currentGrid));
                document.getElementById('undo-btn').disabled = false;
                currentGrid = applyFold(currentGrid, dragAction);
                foldCount++;
                document.getElementById('fold-count').innerText = foldCount;
                checkVictory();
            }
            dragAction = null;
            renderGame();
        }

        gameCanvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);
        gameCanvas.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('touchend', endDrag);

        // --- 演示模式 (全局点击监听) ---
        let clickTimer = null;
        
        // 点击灯泡按钮
        hintBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 阻止事件冒泡到全局点击
            if (isAnimating) return; // 动画过程中禁止切换

            isHintMode = !isHintMode;
            if (isHintMode) {
                hintBtn.classList.add('active');
                overlay.classList.add('show');
                showToast("进入查看答案模式");
                
                // 如果当前状态不是初始状态，强制重置以开始演示
                if (demoStepIndex !== 0 || !isGridEqual(currentGrid, startGrid)) {
                    demoStepIndex = 0;
                    currentGrid = deepCopyGrid(startGrid);
                    historyStack = [];
                    document.getElementById('undo-btn').disabled = true;
                    renderGame();
                }
            } else {
                hintBtn.classList.remove('active');
                overlay.classList.remove('show');
                showToast("退出查看答案模式");
            }
        });

        // 拦截全屏点击（仅在演示模式下有效）
        overlay.addEventListener('click', (e) => {
            if (!isHintMode || isAnimating) return;

            if (clickTimer !== null) {
                // 双击
                clearTimeout(clickTimer);
                clickTimer = null;
                demoUndo();
            } else {
                // 单击延迟判定
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    demoNext();
                }, 250);
            }
        });

        // 演示下一步 (带折痕高亮动画)
        function demoNext() {
            if (demoStepIndex >= solutionSteps.length) {
                showToast("已经是最后一步了");
                return;
            }

            isAnimating = true;
            const action = solutionSteps[demoStepIndex];

            // 1. 先高亮折痕
            drawBoard(ctx, currentGrid);
            drawHighlightLine(ctx, action);

            // 2. 延迟1秒后执行折叠
            setTimeout(() => {
                demoStepIndex++;
                currentGrid = calculateGridFromSteps(demoStepIndex);
                foldCount = demoStepIndex;
                document.getElementById('fold-count').innerText = foldCount;
                
                isAnimating = false;
                renderGame();
                showToast(`演示第 ${demoStepIndex} / ${solutionSteps.length} 步`);
                checkVictory();
            }, 1000);
        }

        // 演示上一步
        function demoUndo() {
            if (demoStepIndex === 0) {
                showToast("已经是初始状态");
                return;
            }
            
            demoStepIndex--;
            currentGrid = calculateGridFromSteps(demoStepIndex);
            foldCount = demoStepIndex;
            document.getElementById('fold-count').innerText = foldCount;
            
            renderGame();
            showToast(`撤回至第 ${demoStepIndex} 步`);
        }

        // --- 控制逻辑 ---
        function initGame() {
            isVictory = false;
            isDragging = false;
            dragAction = null;
            isHintMode = false;
            isAnimating = false;
            foldCount = 0;
            historyStack = [];
            demoStepIndex = 0;
            
            hintBtn.classList.remove('active');
            overlay.classList.remove('show');
            document.getElementById('undo-btn').disabled = true;
            
            targetFoldCount = Math.floor(Math.random() * 3) + 4;
            document.getElementById('target-folds').innerText = targetFoldCount;
            document.getElementById('fold-count').innerText = 0;
            document.getElementById('status-text').innerText = '进行中';
            document.getElementById('status-text').style.color = '#5bc0de';
            document.getElementById('victory-popup').classList.remove('show');

            startGrid = createRandomGrid();
            currentGrid = deepCopyGrid(startGrid);
            targetGrid = generateTargetGrid(startGrid, targetFoldCount);
            
            if (isGridEqual(startGrid, targetGrid)) {
                return initGame();
            }
            
            renderGame();
            drawBoard(tCtx, targetGrid);
            startTimer();
        }

        function undo() {
            if (isHintMode) return; // 演示模式下禁用普通撤回
            if (historyStack.length === 0 || isVictory) return;
            currentGrid = historyStack.pop();
            foldCount = Math.max(0, foldCount - 1);
            document.getElementById('fold-count').innerText = foldCount;
            
            if (historyStack.length === 0) {
                document.getElementById('undo-btn').disabled = true;
            }
            renderGame();
        }

        function cheatFold() {
            if (isVictory || isDragging || isHintMode) return;
            
            const axes = ['V', 'H', 'M', 'A'];
            const axis = axes[Math.floor(Math.random() * axes.length)];
            let action;
            
            if (axis === 'V') action = { axis, k: Math.floor(Math.random()*(N-1))+1, side: Math.random()>0.5?'left':'right' };
            if (axis === 'H') action = { axis, k: Math.floor(Math.random()*(N-1))+1, side: Math.random()>0.5?'top':'bottom' };
            if (axis === 'M') action = { axis, k: Math.floor(Math.random()*(2*N-1))-(N-1), side: Math.random()>0.5?'top-left':'bottom-right' };
            if (axis === 'A') action = { axis, k: Math.floor(Math.random()*(2*N-1))+1, side: Math.random()>0.5?'bottom-left':'top-right' };
            
            historyStack.push(deepCopyGrid(currentGrid));
            document.getElementById('undo-btn').disabled = false;
            
            currentGrid = applyFold(currentGrid, action);
            foldCount++;
            document.getElementById('fold-count').innerText = foldCount;
            checkVictory();
            renderGame();
        }

        function checkVictory() {
            if (isGridEqual(currentGrid, targetGrid)) {
                if (isVictory) return; // 避免重复触发
                isVictory = true;
                document.getElementById('status-text').innerText = '已完成';
                document.getElementById('status-text').style.color = '#32CD32';
                document.getElementById('victory-popup').classList.add('show');
                stopTimer();
                
                if (isHintMode) {
                    hintBtn.classList.remove('active');
                    overlay.classList.remove('show');
                    isHintMode = false;
                }
            }
        }

        // 复盘 (backToReview = true) 或 下一题 (false)
        function closeVictory(backToReview) {
            document.getElementById('victory-popup').classList.remove('show');
            if (backToReview) {
                // 复盘模式：仅仅关闭弹窗，保留当前盘面，重置胜利状态以允许操作（或者仅允许查看）
                isVictory = false; 
                document.getElementById('status-text').innerText = '复盘模式';
                document.getElementById('status-text').style.color = '#FFD700';
                // 将历史栈重置，防止复盘时撤回导致状态错乱
                historyStack = [];
                document.getElementById('undo-btn').disabled = true;
            } else {
                initGame();
            }
        }

        function showToast(msg) {
            toastEl.innerText = msg;
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2000);
        }

        // --- 计时器 ---
        let timeLeft = 300;
        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 300;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isVictory) {
                        document.getElementById('status-text').innerText = '时间到';
                        document.getElementById('status-text').style.color = '#DC143C';
                        isVictory = true;
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        initGame();
    </script>
</body>
</html>
