<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>缤纷叠影</title>
    <style>
        :root {
            --bg-color: #1a1c2c;
            --panel-bg: #282a40;
            --primary-color: #5bc0de;
            --text-color: #ffffff;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            background-image: radial-gradient(circle at 50% 0%, #2a2d4d 0%, #1a1c2c 100%);
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin-bottom: 5px;
            padding: 0 10px;
        }

        .top-left-group, .top-right-group { display: flex; gap: 10px; }

        .game-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            flex-grow: 1;
        }

        .icon-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #aaa; font-size: 20px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s;
            z-index: 200;
        }
        .icon-btn:active { transform: scale(0.9); }

        #hint-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        #help-btn { color: #5bc0de; border-color: rgba(91, 192, 222, 0.4); }
        #settings-btn { color: #a18cd1; border-color: rgba(161, 140, 209, 0.4); }
        #camera-btn { color: #FFD700; border-color: rgba(255, 215, 0, 0.4); }

        .timer-display {
            font-size: 14px; color: #ccc;
            margin-bottom: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 16px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .level-display {
            font-size: 14px; color: #a18cd1;
            margin-bottom: 10px; font-weight: bold; letter-spacing: 1px;
        }

        .status-bar {
            width: 100%; max-width: 400px;
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 8px; font-size: 14px; color: #ccc;
        }
        .status-bar span { display: flex; align-items: center; gap: 5px; }

        .progress-container {
            width: 100%; max-width: 400px;
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 5px; padding: 0 10px;
        }

        .match-text { font-size: 13px; color: #aaa; white-space: nowrap; width: 95px; }
        .progress-bar-wrapper {
            flex-grow: 1; height: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px; overflow: hidden;
            position: relative; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #a18cd1 0%, #5bc0de 100%);
            border-radius: 6px; transition: width 0.3s ease-out, background 0.3s;
        }
        .progress-text { font-size: 13px; color: #ccc; width: 45px; text-align: right; }

        .toggle-container {
            width: 100%; max-width: 400px;
            display: flex; justify-content: center; align-items: center;
            gap: 10px; margin-bottom: 10px; padding: 0 10px;
            font-size: 13px; color: #ccc;
        }

        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .3s; border-radius: 22px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: #fff; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(18px); }

        .game-container {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 400px; position: relative;
        }

        .board-header {
            width: 100%; display: flex; align-items: center;
            justify-content: space-between; padding: 0 5px; margin-bottom: 5px;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }

        .history-controls, .axis-controls {
            display: flex; gap: 5px; background: rgba(0,0,0,0.2);
            padding: 3px; border-radius: 10px;
        }

        .small-icon-btn {
            width: 30px; height: 30px; border-radius: 8px;
            background: transparent; border: 1px solid transparent;
            color: #aaa; font-size: 16px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }
        .small-icon-btn:not(:disabled):hover { background: rgba(255, 255, 255, 0.1); }
        .small-icon-btn:not(:disabled):active { background: rgba(255, 255, 255, 0.2); }
        .small-icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .axis-btn {
            font-size: 18px; font-weight: bold; color: #ccc;
            width: 30px; height: 30px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; background: transparent;
        }
        .axis-btn.active {
            background: rgba(91, 192, 222, 0.2);
            color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(91, 192, 222, 0.4);
        }

        .line { background: #ccc; border-radius: 2px; transition: all 0.2s; }
        .horiz { width: 16px; height: 2px; }
        .vert { width: 2px; height: 16px; }
        .diag-m { width: 2px; height: 20px; transform: rotate(45deg); }
        .diag-a { width: 2px; height: 20px; transform: rotate(-45deg); }
        
        .axis-btn.active .line {
            background: var(--primary-color);
            box-shadow: 0 0 6px var(--primary-color);
        }

        .board-label { font-size: 13px; color: #aaa; }

        .board-wrapper {
            position: relative;
            width: 100%;
            /* 移除 aspect-ratio，改用 padding-bottom 技巧兼容老版本 WebView */
            padding-top: 100%; 
            background: var(--panel-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            touch-action: none;
            overflow: hidden; /* 防止内部溢出 */
        }

        .board-wrapper.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(91, 192, 222, 0.3);
        }

        /* 绝对定位填充容器 */
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 6px; display: block;
            cursor: grab;
            background-color: #ffffff; /* 加入纯白背景兜底，即使不渲染也不是黑屏 */
        }
        canvas:active { cursor: grabbing; }

        .target-wrapper {
            width: 55%; 
            position: relative; 
            margin-top: 20px;
            padding-top: 55%; /* 宽高比技巧：55% * 宽 */
        }

        .controls {
            display: flex; gap: 10px; margin-top: 15px;
            align-items: center; width: 100%; justify-content: center;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 10px 14px; border-radius: 12px;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; flex: 1; max-width: 100px;
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.2); }
        .action-btn .icon { font-size: 18px; }

        .btn {
            background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%);
            border: none; color: #333; padding: 10px 20px;
            font-size: 15px; font-weight: bold; border-radius: 20px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(161, 140, 209, 0.4);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .small-btn {
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ccc; padding: 8px 16px; border-radius: 20px;
            font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .small-btn:active { background: rgba(255, 255, 255, 0.1); }

        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 150; display: none; cursor: pointer;
        }
        .overlay.show { display: block; }

        .modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 22, 37, 0.95);
            padding: 25px 30px; border-radius: 16px;
            text-align: center; z-index: 300;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 50px rgba(91, 192, 222, 0.4);
            display: flex; flex-direction: column; gap: 15px;
            max-width: 90%; width: 340px;
        }
        .modal.show { transform: translate(-50%, -50%) scale(1); }
        .modal h2 { color: var(--primary-color); font-size: 20px; margin-bottom: 5px; }
        .modal p { font-size: 14px; color: #ccc; line-height: 1.6; text-align: left; margin-bottom: 10px;}
        
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; text-align: left; }
        .input-group label { font-size: 13px; color: #aaa; }
        .input-group input {
            padding: 10px; border-radius: 8px; border: 1px solid #555;
            background: #1a1c2c; color: #fff; font-size: 16px; outline: none;
        }
        .input-group input:focus { border-color: var(--primary-color); }

        .upload-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .upload-box { 
            flex: 1; aspect-ratio: 1; border: 2px dashed rgba(255,255,255,0.3); 
            border-radius: 8px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer; 
            position: relative; overflow: hidden; background: rgba(0,0,0,0.2); 
            transition: all 0.2s; 
        }
        .upload-box:hover { border-color: var(--primary-color); background: rgba(91, 192, 222, 0.1); }
        .upload-box .icon { font-size: 28px; margin-bottom: 5px; }
        .upload-box .text { font-size: 13px; color: #ccc; }
        .upload-box input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .upload-box img { display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 10; }
        .upload-box img.show { display: block; }
        
        .paste-hint { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; }
        
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-row .input-group { flex: 1; min-width: 45%; margin-bottom: 0; }
        
        .modal-btns { display: flex; justify-content: space-between; margin-top: 10px; align-items: center; }

        .toast {
            position: fixed; bottom: 20%; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); color: #fff;
            padding: 10px 20px; border-radius: 20px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; z-index: 1000; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="top-bar">
        <div class="top-left-group">
            <div class="icon-btn" id="help-btn" title="查看规则">❓</div>
            <div class="icon-btn" id="settings-btn" title="游戏设置">⚙️</div>
        </div>
        <div class="game-title">缤纷叠影</div>
        <div class="top-right-group">
            <div class="icon-btn" id="camera-btn" title="图像识别自定义">📷</div>
            <div class="icon-btn" id="hint-btn" title="进入/退出演示模式">💡</div>
        </div>
    </div>
    
    <div class="timer-display">剩余时间: <span id="timer">--:--</span></div>
    <div class="level-display">当前题目编号: <span id="level-id">-</span></div>

    <div class="status-bar">
        <span>🔄 折叠: <span id="fold-count">0</span> / <span id="target-folds">-</span>次</span>
        <span>🎯 状态: <span id="status-text" style="color:#5bc0de;">准备就绪</span></span>
    </div>

    <div class="progress-container">
        <div class="match-text">匹配: <span id="match-count">0</span>/<span id="total-count">196</span></div>
        <div class="progress-bar-wrapper">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-text" id="progress-text">0%</div>
    </div>

    <div class="toggle-container">
        <span>仅显示匹配色块</span>
        <label class="switch">
            <input type="checkbox" id="match-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="game-container">
        
        <div class="board-header">
            <div class="header-left">
                <div class="history-controls">
                    <button class="small-icon-btn" id="undo-btn" title="撤回" disabled>↩️</button>
                    <button class="small-icon-btn" id="redo-btn" title="前进" disabled>↪️</button>
                </div>
                <div class="axis-controls">
                    <div class="axis-btn" id="axis-h" title="锁定横折痕（上下折叠）"><div class="line horiz"></div></div>
                    <div class="axis-btn" id="axis-v" title="锁定竖折痕（左右折叠）"><div class="line vert"></div></div>
                    <div class="axis-btn" id="axis-m" title="锁定主对角折痕（\）"><div class="line diag-m"></div></div>
                    <div class="axis-btn" id="axis-a" title="锁定副对角折痕（/）"><div class="line diag-a"></div></div>
                </div>
            </div>
            <div class="board-label">当前盘面</div>
        </div>

        <div class="board-wrapper active" id="board-wrapper-main">
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="board-wrapper target-wrapper" id="board-wrapper-target">
            <div class="label" style="position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:13px; color:#aaa; white-space:nowrap;">目标图形</div>
            <canvas id="target-canvas"></canvas>
        </div>

        <div class="controls">
            <button class="action-btn" id="reset-btn">
                <span class="icon">1️⃣</span>
                <span>重置盘面</span>
            </button>
            <button class="action-btn" id="new-btn">
                <span class="icon" id="new-btn-icon">▶️</span>
                <span id="new-btn-text">开始游戏</span>
            </button>
            <button class="action-btn" id="custom-btn">
                <span class="icon">3️⃣</span>
                <span>指定编号</span>
            </button>
        </div>

        <!-- 各种弹窗、Toast 保持不变，在此省略以节省篇幅 -->
        <div class="modal" id="victory-popup">
            <h2>🎉 挑战成功！</h2>
            <div>
                <button class="small-btn" style="padding: 10px 20px;" onclick="closeVictory(true)">返回复盘</button>
                <button class="btn" style="margin-left: 10px; padding: 10px 20px;" onclick="closeVictory(false)">下一题</button>
            </div>
        </div>
        <div class="modal" id="rules-popup">
            <h2>📜 游戏规则</h2>
            <p>1. <b>拖动盘面</b>：决定折痕位置。<br>2. <b>锁定方向</b>：可锁定特定方向折痕。<br>3. <b>双击确认</b>：执行翻折动画。<br>4. <b>辅助开关</b>：隐藏错误色块。<br>5. <b>目标</b>：将彩色盘面折叠成目标图形。</p>
            <button class="btn" onclick="closeRules()">我知道了</button>
        </div>
        <div class="modal" id="settings-popup">
            <h2>⚙️ 自定义设置</h2>
            <div class="input-group"><label>1️⃣ 颜色种类数目（2-8）</label><input type="number" id="setting-colors" min="2" max="8" value="5"></div>
            <div class="input-group"><label>2️⃣ 盘面规格大小（4-12）</label><input type="number" id="setting-size" min="4" max="12" value="7"></div>
            <div class="input-group"><label>3️⃣ 折叠次数（如 5 或 4-6）</label><input type="text" id="setting-folds" value="4-6"></div>
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <button class="small-btn" onclick="closeSettings()">取消</button><button class="btn" onclick="applySettings()">应用设置</button>
            </div>
        </div>
        <div class="modal" id="custom-id-popup">
            <h2>🔢 指定题目编号</h2>
            <div class="input-group"><input type="number" id="custom-id-input" min="1" max="100000" placeholder="输入 1 - 100000" value="1"></div>
            <div>
                <button class="small-btn" onclick="closeCustomPopup()">取消</button>
                <button class="btn" style="margin-left: 10px;" onclick="confirmCustomId()">开始挑战</button>
            </div>
        </div>
        <div class="modal" id="image-import-popup">
            <h2>📷 截图识别自定义</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center; margin-bottom: 15px;">请分别上传「当前盘面」和「目标图形」的完整方形截图，无需框选。</p>
            <div class="upload-container">
                <div class="upload-box" id="upload-start-box"><span class="icon">📷</span><span class="text">上传初始图</span><input type="file" id="file-start" accept="image/*"><img id="preview-start"></div>
                <div class="upload-box" id="upload-target-box"><span class="icon">🎯</span><span class="text">上传目标图</span><input type="file" id="file-target" accept="image/*"><img id="preview-target"></div>
            </div>
            <div class="paste-hint">💡 电脑端可直接按 Ctrl + V 粘贴截图</div>
            <div class="input-row">
                <div class="input-group"><label>盘面大小 (N×N)</label><input type="number" id="import-size" min="4" max="12" value="7"></div>
                <div class="input-group"><label>颜色种数</label><input type="number" id="import-colors" min="2" max="8" value="5"></div>
            </div>
            <div class="input-group" style="margin-bottom: 15px;"><label>目标折叠次数</label><input type="number" id="import-folds" min="1" max="20" value="6"></div>
            <div class="modal-btns">
                <button class="small-btn" onclick="closeImagePopup()">取消</button><button class="btn" onclick="startImageRecognition()">开始挑战</button>
            </div>
        </div>
        <div class="toast" id="toast"></div>
    </div>

    <script>
        let N = 7; 
        let colorCount = 5; 
        let foldRangeText = "4-6";
        let isGameStarted = false; 

        let COLORS = ['#FF8C00', '#8A2BE2', '#DC143C', '#FFD700', '#87CEEB', '#00008B', '#FF69B4', '#32CD32'];

        let startGrid = [];
        let targetGrid = [];
        let currentGrid = [];
        
        let stateHistory = []; 
        let currentStateIndex = -1;
        
        let foldCount = 0;
        let targetFoldCount = 6;
        let isVictory = false;
        
        let isHintMode = false;
        let solutionSteps = []; 
        
        let isDragging = false;
        let hasDragged = false;
        let startPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let dragAction = null;      
        let pendingAction = null;   
        let lastTap = 0;            
        let lockedAxis = null; 
        let showOnlyMatched = false; 

        let isAnimating = false;
        let animationState = { action: null, startTime: 0, duration: 500, onComplete: null };
        let currentLevelId = 1;

        const gameCanvas = document.getElementById('game-canvas');
        const ctx = gameCanvas.getContext('2d');
        const targetCanvas = document.getElementById('target-canvas');
        const tCtx = targetCanvas.getContext('2d');
        const toastEl = document.getElementById('toast');
        const hintBtn = document.getElementById('hint-btn');
        const overlay = document.getElementById('overlay');
        const matchToggle = document.getElementById('match-toggle');
        
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const helpBtn = document.getElementById('help-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const cameraBtn = document.getElementById('camera-btn');
        const rulesPopup = document.getElementById('rules-popup');
        const settingsPopup = document.getElementById('settings-popup');
        const customIdPopup = document.getElementById('custom-id-popup');
        const customIdInput = document.getElementById('custom-id-input');
        const imageImportPopup = document.getElementById('image-import-popup');

        const matchCountEl = document.getElementById('match-count');
        const totalCountEl = document.getElementById('total-count');
        const progressFillEl = document.getElementById('progress-fill');
        const progressTextEl = document.getElementById('progress-text');

        const axisBtns = {
            'H': document.getElementById('axis-h'),
            'V': document.getElementById('axis-v'),
            'M': document.getElementById('axis-m'),
            'A': document.getElementById('axis-a')
        };

        // --- 修复移动端 Canvas 黑屏的核心逻辑 ---
        // 根据物理尺寸动态调整 canvas.width 和 canvas.height
        function resizeCanvases() {
            const dpr = window.devicePixelRatio || 1;
            
            const mainRect = gameCanvas.parentElement.getBoundingClientRect();
            // 如果跳转瞬间没渲染出宽度，兜底给300
            const mainSize = Math.max(mainRect.width, 300); 
            if (gameCanvas.width !== Math.floor(mainSize * dpr)) {
                gameCanvas.width = Math.floor(mainSize * dpr);
                gameCanvas.height = Math.floor(mainSize * dpr);
            }

            const targetRect = targetCanvas.parentElement.getBoundingClientRect();
            const targetSize = Math.max(targetRect.width, 200);
            if (targetCanvas.width !== Math.floor(targetSize * dpr)) {
                targetCanvas.width = Math.floor(targetSize * dpr);
                targetCanvas.height = Math.floor(targetSize * dpr);
            }
        }

        function refreshBothBoards() {
            if (!currentGrid || currentGrid.length === 0) return;
            
            resizeCanvases();
            
            drawBoard(ctx, currentGrid, showOnlyMatched ? targetGrid : null);
            drawBoard(tCtx, targetGrid, null);
            renderGame(); 
        }

        // 强制重绘监听器（针对从首页跳转来的白屏/黑屏）
        window.addEventListener('pageshow', (e) => {
            setTimeout(resizeAndRefresh, 100);
        });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                setTimeout(resizeAndRefresh, 100);
            }
        });
        window.addEventListener('resize', () => {
            setTimeout(resizeAndRefresh, 100);
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeAndRefresh, 200);
        });

        function resizeAndRefresh() {
            resizeCanvases();
            refreshBothBoards();
        }

        // --- 原有逻辑 ---
        matchToggle.addEventListener('change', (e) => {
            showOnlyMatched = e.target.checked;
            refreshBothBoards();
        });

        function setLockedAxis(axis) {
            if (lockedAxis === axis) lockedAxis = null; else lockedAxis = axis;
            for (let key in axisBtns) {
                if (key === lockedAxis) axisBtns[key].classList.add('active');
                else axisBtns[key].classList.remove('active');
            }
        }

        for (let key in axisBtns) {
            axisBtns[key].addEventListener('click', () => setLockedAxis(key));
        }

        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function createRandomGrid(rng) {
            const activeColors = COLORS.slice(0, colorCount);
            const grid = [];
            for (let x = 0; x < N; x++) {
                grid[x] = [];
                for (let y = 0; y < N; y++) {
                    grid[x][y] = [
                        activeColors[Math.floor(rng() * activeColors.length)],
                        activeColors[Math.floor(rng() * activeColors.length)],
                        activeColors[Math.floor(rng() * activeColors.length)],
                        activeColors[Math.floor(rng() * activeColors.length)]
                    ];
                }
            }
            return grid;
        }

        function deepCopyGrid(grid) { return JSON.parse(JSON.stringify(grid)); }

        function isGridEqual(g1, g2) {
            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        if (g1[x][y][i] !== g2[x][y][i]) return false;
                    }
                }
            }
            return true;
        }

        function calculateMatch(g1, g2) {
            let count = 0;
            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        if (g1[x][y][i] === g2[x][y][i]) count++;
                    }
                }
            }
            return count;
        }

        function applyFold(grid, action) {
            const newGrid = deepCopyGrid(grid);
            const { axis, k, side } = action;

            function getTriangleIndex(fx, fy) {
                if (Math.abs(fx - 0.5) < 0.01 && Math.abs(fy - 0.25) < 0.01) return 0; 
                if (Math.abs(fx - 0.75) < 0.01 && Math.abs(fy - 0.5) < 0.01) return 1; 
                if (Math.abs(fx - 0.5) < 0.01 && Math.abs(fy - 0.75) < 0.01) return 2; 
                if (Math.abs(fx - 0.25) < 0.01 && Math.abs(fy - 0.5) < 0.01) return 3; 
                return 0;
            }

            const centers = [{ dx: 0.5, dy: 0.25 }, { dx: 0.75, dy: 0.5 }, { dx: 0.5, dy: 0.75 }, { dx: 0.25, dy: 0.5 }];

            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    for (let i = 0; i < 4; i++) {
                        let cx = x + centers[i].dx, cy = y + centers[i].dy;
                        let isReserved = false;

                        if (axis === 'V') {
                            if (side === 'left' && cx < k) isReserved = true;
                            if (side === 'right' && cx > k) isReserved = true;
                        } else if (axis === 'H') {
                            if (side === 'top' && cy < k) isReserved = true;
                            if (side === 'bottom' && cy > k) isReserved = true;
                        } else if (axis === 'M') {
                            if (side === 'top-left' && cy - cx < k) isReserved = true;
                            if (side === 'bottom-right' && cy - cx > k) isReserved = true;
                        } else if (axis === 'A') {
                            if (side === 'top-left' && cx + cy < k) isReserved = true;
                            if (side === 'bottom-right' && cx + cy > k) isReserved = true;
                        }

                        if (isReserved) continue; 

                        let cx_src = cx, cy_src = cy;
                        if (axis === 'V') cx_src = 2 * k - cx;
                        else if (axis === 'H') cy_src = 2 * k - cy;
                        else if (axis === 'M') { cx_src = cy - k; cy_src = cx + k; }
                        else if (axis === 'A') { cx_src = k - cy; cy_src = k - cx; }

                        let x_src = Math.floor(cx_src), y_src = Math.floor(cy_src);
                        
                        if (x_src >= 0 && x_src < N && y_src >= 0 && y_src < N) {
                            let i_src = getTriangleIndex(cx_src - x_src, cy_src - y_src);
                            newGrid[x][y][i] = grid[x_src][y_src][i_src];
                        }
                    }
                }
            }
            return newGrid;
        }

        function getRandomFolds(rng) {
            if (foldRangeText.includes('-')) {
                let parts = foldRangeText.split('-');
                let min = parseInt(parts[0]), max = parseInt(parts[1]);
                if (isNaN(min) || isNaN(max)) min = 4, max = 6;
                if (min > max) { let temp = min; min = max; max = temp; }
                return Math.floor(rng() * (max - min + 1)) + min;
            } else {
                let val = parseInt(foldRangeText); return isNaN(val) ? 4 : val;
            }
        }

        function generateTargetGrid(rng, grid) {
            let tempGrid = deepCopyGrid(grid);
            solutionSteps = [];
            targetFoldCount = getRandomFolds(rng);
            if (targetFoldCount < 1) targetFoldCount = 1;

            while (solutionSteps.length < targetFoldCount) {
                let found = false;
                for (let attempt = 0; attempt < 50; attempt++) {
                    const axes = ['V', 'H', 'M', 'A'];
                    const axis = axes[Math.floor(rng() * axes.length)];
                    let action = null;
                    
                    if (axis === 'V' || axis === 'H') {
                        const k = Math.floor(rng() * (N - 1)) + 1;
                        const side = rng() > 0.5 ? (axis === 'V' ? 'left' : 'top') : (axis === 'V' ? 'right' : 'bottom');
                        action = { axis, k, side };
                    } else if (axis === 'M') {
                        const k = Math.floor(rng() * (2 * N - 1)) - (N - 1);
                        action = { axis, k, side: rng() > 0.5 ? 'top-left' : 'bottom-right' };
                    } else if (axis === 'A') {
                        const k = Math.floor(rng() * (2 * N - 1)) + 1;
                        action = { axis, k, side: rng() > 0.5 ? 'top-left' : 'bottom-right' };
                    }
                    
                    let testGrid = applyFold(tempGrid, action);
                    if (!isGridEqual(testGrid, tempGrid)) {
                        tempGrid = testGrid; solutionSteps.push(action); found = true; break; 
                    }
                }
                if (!found) {
                    let action = { axis: 'V', k: Math.floor(N/2), side: 'left' };
                    tempGrid = applyFold(tempGrid, action); solutionSteps.push(action);
                }
            }
            return tempGrid;
        }

        function pushState(newGrid) {
            if (currentStateIndex < stateHistory.length - 1) stateHistory = stateHistory.slice(0, currentStateIndex + 1);
            currentGrid = deepCopyGrid(newGrid); 
            stateHistory.push(currentGrid);
            currentStateIndex = stateHistory.length - 1;
            foldCount = currentStateIndex;
            document.getElementById('fold-count').innerText = foldCount;
            updateHistoryButtons(); updateProgress(); checkVictory(); refreshBothBoards(); 
        }

        function updateHistoryButtons() {
            undoBtn.disabled = (currentStateIndex <= 0) || isVictory || isHintMode || isAnimating || !isGameStarted;
            redoBtn.disabled = (currentStateIndex >= stateHistory.length - 1) || isVictory || isHintMode || isAnimating || !isGameStarted;
        }

        function goUndo() {
            if (currentStateIndex > 0 && isGameStarted) {
                currentStateIndex--; currentGrid = deepCopyGrid(stateHistory[currentStateIndex]);
                document.getElementById('fold-count').innerText = currentStateIndex; pendingAction = null;
                updateHistoryButtons(); updateProgress(); refreshBothBoards();
            }
        }

        function goRedo() {
            if (currentStateIndex < stateHistory.length - 1 && isGameStarted) {
                currentStateIndex++; currentGrid = deepCopyGrid(stateHistory[currentStateIndex]);
                document.getElementById('fold-count').innerText = currentStateIndex; pendingAction = null;
                updateHistoryButtons(); updateProgress(); refreshBothBoards();
            }
        }

        function updateProgress() {
            const totalTris = N * N * 4;
            totalCountEl.innerText = totalTris;
            if (!isGameStarted) {
                matchCountEl.innerText = '0'; progressFillEl.style.width = '0%'; progressTextEl.innerText = '0%'; return;
            }
            const matchCount = calculateMatch(currentGrid, targetGrid);
            const percent = Math.floor((matchCount / totalTris) * 100);
            matchCountEl.innerText = matchCount; progressFillEl.style.width = `${percent}%`; progressTextEl.innerText = `${percent}%`;
            if (percent === 100) {
                progressFillEl.style.background = 'linear-gradient(90deg, #32CD32 0%, #00FF00 100%)';
                progressTextEl.style.color = '#32CD32';
            } else {
                progressFillEl.style.background = 'linear-gradient(90deg, #a18cd1 0%, #5bc0de 100%)';
                progressTextEl.style.color = '#ccc';
            }
        }

        function drawBoard(ctx, grid, compareGrid = null) {
            const width = ctx.canvas.width;
            if (width === 0) return; // 安全判定
            const cellSize = width / N;
            ctx.clearRect(0, 0, width, width);

            if (!grid || grid.length === 0) return;

            for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                    const px = x * cellSize, py = y * cellSize;
                    const cx = px + cellSize / 2, cy = py + cellSize / 2;
                    const colors = grid[x][y] || [];
                    const compColors = compareGrid ? compareGrid[x][y] : null;

                    const getColor = (idx) => {
                        let c = colors[idx];
                        if (!c || c === 'rgb(0, 0, 0)' || c === 'rgb(0,0,0)' || c === '#000000') return '#ffffff';
                        if (compColors && c !== compColors[idx]) return '#ffffff'; 
                        return c;
                    };

                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = getColor(0); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py); ctx.lineTo(px + cellSize, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = getColor(1); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(px + cellSize, py + cellSize); ctx.lineTo(px, py + cellSize); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = getColor(2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(px, py + cellSize); ctx.lineTo(px, py); ctx.lineTo(cx, cy); ctx.closePath();
                    ctx.fillStyle = getColor(3); ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + cellSize, py + cellSize); ctx.moveTo(px + cellSize, py); ctx.lineTo(px, py + cellSize); ctx.stroke();
                    ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(px, py, cellSize, cellSize);
                }
            }
        }

        function getFoldRegionPath(action) {
            const W = gameCanvas.width;
            if (W === 0) return [];
            const cellSize = W / N;
            const { axis, k, side } = action;
            const c = k * cellSize;
            const points = [];

            const isReserved = (x, y) => {
                const eps = 0.1; 
                if (axis === 'V') {
                    if (side === 'left' && x < c - eps) return true;
                    if (side === 'right' && x > c + eps) return true;
                } else if (axis === 'H') {
                    if (side === 'top' && y < c - eps) return true;
                    if (side === 'bottom' && y > c + eps) return true;
                } else if (axis === 'M') {
                    if (side === 'top-left' && y - x < c - eps) return true;
                    if (side === 'bottom-right' && y - x > c + eps) return true;
                } else if (axis === 'A') {
                    if (side === 'top-left' && x + y < c - eps) return true;
                    if (side === 'bottom-right' && x + y > c + eps) return true;
                }
                return false;
            };

            const corners = [{x:0,y:0}, {x:W,y:0}, {x:W,y:W}, {x:0,y:W}];
            corners.forEach(p => { if (isReserved(p.x, p.y)) points.push(p); });

            let intersections = [];
            if (axis === 'V') intersections.push({x:c, y:0}, {x:c, y:W});
            else if (axis === 'H') intersections.push({x:0, y:c}, {x:W, y:c});
            else if (axis === 'M') intersections.push({x:0, y:c}, {x:-c, y:0}, {x:W, y:W+c}, {x:W-c, y:W});
            else if (axis === 'A') intersections.push({x:0, y:c}, {x:c, y:0}, {x:W, y:c-W}, {x:c-W, y:W});

            intersections.forEach(p => {
                if (p.x >= -0.1 && p.x <= W + 0.1 && p.y >= -0.1 && p.y <= W + 0.1) {
                    p.x = Math.max(0, Math.min(W, p.x)); p.y = Math.max(0, Math.min(W, p.y)); points.push(p);
                }
            });

            const uniquePoints = [];
            points.forEach(p => {
                let isDup = false;
                for (let i = 0; i < uniquePoints.length; i++) {
                    if (Math.hypot(uniquePoints[i].x - p.x, uniquePoints[i].y - p.y) < 1) { isDup = true; break; }
                }
                if (!isDup) uniquePoints.push(p);
            });

            if (uniquePoints.length < 3) return [];
            let cx = 0, cy = 0; uniquePoints.forEach(p => { cx += p.x; cy += p.y; });
            cx /= uniquePoints.length; cy /= uniquePoints.length;

            uniquePoints.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
            return uniquePoints;
        }

        function renderGame(animProgress = 0) {
            drawBoard(ctx, currentGrid, showOnlyMatched ? targetGrid : null);
            const currentAction = isAnimating ? animationState.action : (isDragging ? dragAction : pendingAction);
            
            if (currentAction) {
                const path = getFoldRegionPath(currentAction);
                if (isAnimating || pendingAction) {
                    ctx.beginPath();
                    if (path.length > 0) {
                        ctx.moveTo(path[0].x, path[0].y);
                        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                        ctx.closePath();
                        let alpha = isAnimating ? 0.4 * (1 - animProgress) : 0.15;
                        ctx.fillStyle = `rgba(255, 69, 0, ${alpha})`; ctx.fill();
                    }
                }

                ctx.save();
                ctx.strokeStyle = '#FF4500'; 
                ctx.lineWidth = isAnimating ? (6 + Math.sin(animProgress * Math.PI) * 4) : 5;
                if (isAnimating || pendingAction) { ctx.shadowBlur = 20; ctx.shadowColor = '#FF4500'; }
                ctx.beginPath();
                if (path.length > 0) {
                    ctx.moveTo(path[0].x, path[0].y);
                    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                    ctx.closePath(); ctx.stroke();
                }
                ctx.restore();
                drawDragHintLine(ctx, currentAction, (isAnimating || pendingAction) ? '#FF4500' : '#ffffff');
            }
        }

        function drawDragHintLine(ctx, action, color) {
            if (!action) return;
            const width = ctx.canvas.width;
            const cellSize = width / N;
            ctx.beginPath(); ctx.strokeStyle = color;
            ctx.lineWidth = color === '#ffffff' ? 3 : 5; ctx.setLineDash([8, 6]);

            if (action.axis === 'V') {
                let x = action.k * cellSize; ctx.moveTo(x, 0); ctx.lineTo(x, width);
            } else if (action.axis === 'H') {
                let y = action.k * cellSize; ctx.moveTo(0, y); ctx.lineTo(width, y);
            } else if (action.axis === 'M') {
                let p1x = 0, p1y = action.k * cellSize, p2x = (N - action.k) * cellSize, p2y = width;
                if (action.k < 0) { p1x = -action.k * cellSize; p1y = 0; p2x = width; p2y = (N + action.k) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            } else if (action.axis === 'A') {
                let p1x = 0, p1y = action.k * cellSize, p2x = action.k * cellSize, p2y = 0;
                if (action.k > N) { p1x = (action.k - N) * cellSize; p1y = width; p2x = width; p2y = (action.k - N) * cellSize; }
                ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
            }
            ctx.stroke(); ctx.setLineDash([]);
        }

        function startFoldAnimation(action, onComplete) {
            if (isAnimating) return;
            isAnimating = true; pendingAction = null; 
            animationState.action = action; animationState.startTime = performance.now(); animationState.onComplete = onComplete;

            function animate(time) {
                let progress = Math.min((time - animationState.startTime) / animationState.duration, 1);
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                renderGame(easeProgress);
                if (progress < 1) requestAnimationFrame(animate);
                else { isAnimating = false; animationState.action = null; if (animationState.onComplete) animationState.onComplete(); }
            }
            requestAnimationFrame(animate); updateHistoryButtons();
        }

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX = evt.clientX, clientY = evt.clientY;
            if (evt.touches && evt.touches.length > 0) { clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY; }
            else if (evt.changedTouches && evt.changedTouches.length > 0) { clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY; }
            // 适配动态画板尺寸
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }

        function getDragAction(startX, startY, endX, endY) {
            const dx = endX - startX, dy = endY - startY;
            if (Math.hypot(dx, dy) < 25) return null;
            const cellSize = gameCanvas.width / N;
            let axis = lockedAxis;

            if (!axis) {
                const absDx = Math.abs(dx), absDy = Math.abs(dy);
                if (absDx > 1.5 * absDy) axis = 'V'; 
                else if (absDy > 1.5 * absDx) axis = 'H'; 
                else if ((dx > 0 && dy > 0) || (dx < 0 && dy < 0)) axis = 'M';
                else axis = 'A';
            }

            if (axis === 'V') {
                let k = Math.round(endX / cellSize);
                if (k <= 0 || k >= N) return null;
                return { axis: 'V', k: k, side: startX < k * cellSize ? 'left' : 'right' };
            } else if (axis === 'H') {
                let k = Math.round(endY / cellSize);
                if (k <= 0 || k >= N) return null;
                return { axis: 'H', k: k, side: startY < k * cellSize ? 'top' : 'bottom' };
            } else if (axis === 'M') {
                let k = Math.round((endY - endX) / cellSize);
                if (k <= -N || k >= N) return null; 
                return { axis: 'M', k: k, side: (startY - startX) < k * cellSize ? 'top-left' : 'bottom-right' };
            } else if (axis === 'A') {
                let k = Math.round((endY + endX) / cellSize);
                if (k <= 0 || k >= 2 * N) return null; 
                return { axis: 'A', k: k, side: (startX + startY) < k * cellSize ? 'top-left' : 'bottom-right' };
            }
            return null;
        }

        function startDrag(e) {
            if (isVictory || isHintMode || isAnimating || !isGameStarted) return;
            e.preventDefault();
            isDragging = true; hasDragged = false; 
            const pos = getMousePos(gameCanvas, e);
            startPos = pos; currentPos = pos; dragAction = null;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            currentPos = getMousePos(gameCanvas, e);
            const dist = Math.hypot(currentPos.x - startPos.x, currentPos.y - startPos.y);
            if (dist > 25) { 
                hasDragged = true; pendingAction = null; 
                dragAction = getDragAction(startPos.x, startPos.y, currentPos.x, currentPos.y);
                renderGame();
            }
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            const pos = getMousePos(gameCanvas, e);
            const dist = Math.hypot(pos.x - startPos.x, pos.y - startPos.y);
            if (hasDragged && dragAction) {
                pendingAction = dragAction; renderGame();
            } else if (dist < 25) {
                const now = Date.now();
                if (now - lastTap < 300) {
                    if (pendingAction) executePendingAction();
                    lastTap = 0; 
                } else lastTap = now;
            }
            dragAction = null;
        }

        gameCanvas.addEventListener('dblclick', (e) => {
            e.preventDefault();
            if (isVictory || isHintMode || isAnimating || !isGameStarted) return;
            if (pendingAction) executePendingAction();
        });

        function executePendingAction() {
            if (!pendingAction) return;
            const action = pendingAction; pendingAction = null;
            startFoldAnimation(action, () => {
                const nextGrid = applyFold(currentGrid, action);
                pushState(nextGrid); 
            });
        }

        gameCanvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);
        gameCanvas.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('touchend', endDrag);

        let clickTimer = null;
        
        hintBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isAnimating || isVictory || !isGameStarted) return;
            if (solutionSteps.length === 0 && !isHintMode) { showToast("当前无演示步骤"); return; }
            isHintMode = !isHintMode;
            if (isHintMode) {
                hintBtn.classList.add('active'); overlay.classList.add('show'); showToast("进入演示模式");
                currentStateIndex = 0; currentGrid = deepCopyGrid(startGrid); stateHistory = [deepCopyGrid(startGrid)]; foldCount = 0; pendingAction = null; 
                document.getElementById('fold-count').innerText = 0; updateHistoryButtons(); updateProgress(); refreshBothBoards(); 
            } else {
                hintBtn.classList.remove('active'); overlay.classList.remove('show'); showToast("退出演示模式"); updateHistoryButtons();
            }
        });

        overlay.addEventListener('click', (e) => {
            if (!isHintMode || isAnimating) return;
            if (clickTimer !== null) { clearTimeout(clickTimer); clickTimer = null; goUndo(); } 
            else { clickTimer = setTimeout(() => { clickTimer = null; demoNextStep(); }, 250); }
        });

        function demoNextStep() {
            if (currentStateIndex >= solutionSteps.length) { showToast("已经是最后一步了"); return; }
            const action = solutionSteps[currentStateIndex];
            startFoldAnimation(action, () => {
                const nextGrid = applyFold(currentGrid, action);
                pushState(nextGrid); 
                showToast(`演示第 ${currentStateIndex} / ${solutionSteps.length} 步`);
            });
        }

        function loadLevel(levelId) {
            isGameStarted = true;
            document.getElementById('new-btn-text').innerText = '新的开始';
            document.getElementById('new-btn-icon').innerText = '2️⃣';
            currentLevelId = levelId; document.getElementById('level-id').innerText = levelId;
            
            isVictory = false; isDragging = false; hasDragged = false; dragAction = null; pendingAction = null; isHintMode = false; isAnimating = false; foldCount = 0;
            
            hintBtn.classList.remove('active'); overlay.classList.remove('show'); document.getElementById('victory-popup').classList.remove('show');
            rulesPopup.classList.remove('show'); settingsPopup.classList.remove('show'); customIdPopup.classList.remove('show');

            const rng = mulberry32(levelId);
            startGrid = createRandomGrid(rng); targetGrid = generateTargetGrid(rng, startGrid);
            if (isGridEqual(startGrid, targetGrid)) return loadLevel(levelId + 1 > 100000 ? 1 : levelId + 1);
            
            stateHistory = [deepCopyGrid(startGrid)]; currentStateIndex = 0; currentGrid = deepCopyGrid(startGrid);
            
            document.getElementById('fold-count').innerText = 0;
            document.getElementById('target-folds').innerText = solutionSteps.length;
            document.getElementById('status-text').innerText = '进行中';
            document.getElementById('status-text').style.color = '#5bc0de';

            updateHistoryButtons(); updateProgress(); refreshBothBoards(); startTimer();
        }

        function startCustomLevel() {
            isGameStarted = true;
            document.getElementById('new-btn-text').innerText = '新的开始';
            document.getElementById('new-btn-icon').innerText = '2️⃣';

            isVictory = false; isDragging = false; hasDragged = false; dragAction = null; pendingAction = null; isHintMode = false; isAnimating = false; foldCount = 0;
            
            hintBtn.classList.remove('active'); overlay.classList.remove('show'); document.getElementById('victory-popup').classList.remove('show'); imageImportPopup.classList.remove('show');
            
            stateHistory = [deepCopyGrid(startGrid)]; currentStateIndex = 0; currentGrid = deepCopyGrid(startGrid);
            
            document.getElementById('fold-count').innerText = 0;
            document.getElementById('target-folds').innerText = targetFoldCount;
            document.getElementById('status-text').innerText = '自定义挑战';
            document.getElementById('status-text').style.color = '#FFD700';

            updateHistoryButtons(); updateProgress(); refreshBothBoards(); startTimer();
        }

        function resetCurrentLevel() {
            if (isAnimating || !isGameStarted) return;
            isVictory = false; isDragging = false; hasDragged = false; pendingAction = null; isHintMode = false;
            hintBtn.classList.remove('active'); overlay.classList.remove('show'); document.getElementById('victory-popup').classList.remove('show');
            stateHistory = [deepCopyGrid(startGrid)]; currentStateIndex = 0; currentGrid = deepCopyGrid(startGrid);
            document.getElementById('fold-count').innerText = 0;
            document.getElementById('status-text').innerText = '进行中';
            document.getElementById('status-text').style.color = '#5bc0de';
            updateHistoryButtons(); updateProgress(); refreshBothBoards(); startTimer();
        }

        function checkVictory() {
            if (!isGameStarted) return;
            if (isGridEqual(currentGrid, targetGrid)) {
                if (isVictory) return;
                isVictory = true;
                document.getElementById('status-text').innerText = '已完成';
                document.getElementById('status-text').style.color = '#32CD32';
                document.getElementById('victory-popup').classList.add('show');
                stopTimer(); updateHistoryButtons();
                if (isHintMode) { hintBtn.classList.remove('active'); overlay.classList.remove('show'); isHintMode = false; }
            }
        }

        function closeVictory(backToReview) {
            document.getElementById('victory-popup').classList.remove('show');
            if (backToReview) {
                isVictory = false; 
                document.getElementById('status-text').innerText = '复盘模式';
                document.getElementById('status-text').style.color = '#FFD700'; updateHistoryButtons();
            } else {
                let nextId = Math.floor(Math.random() * 100000) + 1; loadLevel(nextId);
            }
        }

        function closeRules() { rulesPopup.classList.remove('show'); }

        function openSettings() {
            if (isAnimating) return;
            document.getElementById('setting-colors').value = colorCount;
            document.getElementById('setting-size').value = N;
            document.getElementById('setting-folds').value = foldRangeText;
            settingsPopup.classList.add('show');
        }

        function closeSettings() { settingsPopup.classList.remove('show'); }

        function applySettings() {
            let newColors = parseInt(document.getElementById('setting-colors').value);
            let newSize = parseInt(document.getElementById('setting-size').value);
            let newFolds = document.getElementById('setting-folds').value.trim();

            if (isNaN(newColors) || newColors < 2 || newColors > 8) { showToast("颜色数量请在 2-8 之间"); return; }
            if (isNaN(newSize) || newSize < 4 || newSize > 12) { showToast("盘面尺寸请在 4-12 之间"); return; }
            if (!/^\d+(-\d+)?$/.test(newFolds)) { showToast("折叠次数格式错误"); return; }

            colorCount = newColors; N = newSize; foldRangeText = newFolds;
            closeSettings(); initGame(); showToast("设置已应用，请点击开始游戏");
        }

        function openCustomPopup() {
            if (isAnimating) return;
            customIdInput.value = currentLevelId; customIdPopup.classList.add('show');
        }
        function closeCustomPopup() { customIdPopup.classList.remove('show'); }

        function confirmCustomId() {
            let val = parseInt(customIdInput.value);
            if (isNaN(val) || val < 1 || val > 100000) { showToast("请输入 1 到 100000 之间的数字"); return; }
            loadLevel(val);
        }

        function closeImagePopup() { imageImportPopup.classList.remove('show'); }

        document.getElementById('file-start').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) { const reader = new FileReader(); reader.onload = function(evt) { const img = document.getElementById('preview-start'); img.src = evt.target.result; img.classList.add('show'); }; reader.readAsDataURL(file); }
        });

        document.getElementById('file-target').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) { const reader = new FileReader(); reader.onload = function(evt) { const img = document.getElementById('preview-target'); img.src = evt.target.result; img.classList.add('show'); }; reader.readAsDataURL(file); }
        });

        document.addEventListener('paste', (e) => {
            if (!imageImportPopup.classList.contains('show')) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            let imageFile = null;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) { imageFile = item.getAsFile(); break; }
            }
            if (imageFile) {
                const fStart = document.getElementById('file-start'), fTarget = document.getElementById('file-target');
                if (!fStart.files.length) {
                    const dt = new DataTransfer(); dt.items.add(imageFile); fStart.files = dt.files; fStart.dispatchEvent(new Event('change')); showToast("已粘贴为初始图");
                } else if (!fTarget.files.length) {
                    const dt = new DataTransfer(); dt.items.add(imageFile); fTarget.files = dt.files; fTarget.dispatchEvent(new Event('change')); showToast("已粘贴为目标图");
                } else {
                    const dt = new DataTransfer(); dt.items.add(imageFile); fStart.files = dt.files; fStart.dispatchEvent(new Event('change')); showToast("已替换初始图");
                }
            }
        });

        function processImages(file1, file2, N, colorCount) {
            return new Promise((resolve, reject) => {
                const img1 = new Image(); const img2 = new Image(); let loaded = 0;
                function checkLoad() { loaded++; if (loaded === 2) { try { resolve(analyzeImages(img1, img2, N, colorCount)); } catch (e) { reject(e); } } }
                img1.onload = checkLoad; img2.onload = checkLoad; img1.onerror = reject; img2.onerror = reject;
                img1.src = URL.createObjectURL(file1); img2.src = URL.createObjectURL(file2);
            });
        }

        function analyzeImages(img1, img2, N, colorCount) {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const sampleSize = 100; canvas.width = N * sampleSize; canvas.height = N * sampleSize;

            function processImg(img) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                const grid = []; const colors = [];
                for (let x = 0; x < N; x++) {
                    grid[x] = [];
                    for (let y = 0; y < N; y++) {
                        grid[x][y] = [];
                        const pts = [{ dx: 0.5, dy: 0.25 }, { dx: 0.75, dy: 0.5 }, { dx: 0.5, dy: 0.75 }, { dx: 0.25, dy: 0.5 }];
                        for (let i = 0; i < 4; i++) {
                            const cx = (x + pts[i].dx) * sampleSize, cy = (y + pts[i].dy) * sampleSize;
                            let counts = {};
                            for(let dx = -10; dx <= 10; dx+=2) {
                                for(let dy = -10; dy <= 10; dy+=2) {
                                    const px = Math.floor(cx + dx), py = Math.floor(cy + dy);
                                    if(px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;
                                    const idx = (py * canvas.width + px) * 4;
                                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                                    if(r < 70 && g < 70 && b < 70) continue;
                                    const qr = Math.round(r / 16) * 16, qg = Math.round(g / 16) * 16, qb = Math.round(b / 16) * 16;
                                    const key = `${qr},${qg},${qb}`; counts[key] = (counts[key] || 0) + 1;
                                }
                            }
                            let best = '255,255,255', max = 0;
                            for(let k in counts) { if(counts[k] > max) { max = counts[k]; best = k; } }
                            const rgbStr = `rgb(${best.split(',').join(', ')})`;
                            grid[x][y][i] = rgbStr; colors.push(rgbStr);
                        }
                    }
                }
                return { grid, colors };
            }

            const res1 = processImg(img1), res2 = processImg(img2);
            const allColors = [...res1.colors, ...res2.colors]; const colorFreq = {};
            allColors.forEach(c => colorFreq[c] = (colorFreq[c] || 0) + 1);
            
            let sortedColors = Object.keys(colorFreq).filter(c => {
                let parts = c.match(/\d+/g); return parseInt(parts[0]) > 40 || parseInt(parts[1]) > 40 || parseInt(parts[2]) > 40;
            }).sort((a,b) => colorFreq[b] - colorFreq[a]);
            
            let palette = sortedColors.slice(0, colorCount);
            if (palette.length === 0) palette = ['rgb(255, 140, 0)', 'rgb(138, 43, 226)', 'rgb(220, 20, 60)', 'rgb(255, 215, 0)', 'rgb(135, 206, 235)'].slice(0, colorCount);
            
            function mapToPalette(grid) {
                for(let x=0; x<N; x++) for(let y=0; y<N; y++) for(let i=0; i<4; i++) {
                    let c = grid[x][y][i]; if (palette.includes(c)) continue;
                    let cr = parseInt(c.match(/\d+/g)[0]), cg = parseInt(c.match(/\d+/g)[1]), cb = parseInt(c.match(/\d+/g)[2]);
                    let bestC = palette[0], minD = Infinity;
                    palette.forEach(p => {
                        let pr = parseInt(p.match(/\d+/g)[0]), pg = parseInt(p.match(/\d+/g)[1]), pb = parseInt(p.match(/\d+/g)[2]);
                        let d = (cr-pr)**2 + (cg-pg)**2 + (cb-pb)**2; if (d < minD) { minD = d; bestC = p; }
                    });
                    grid[x][y][i] = bestC;
                }
                return grid;
            }

            return { startGrid: mapToPalette(res1.grid), targetGrid: mapToPalette(res2.grid), palette: palette, colorCount: palette.length, N: N };
        }

        function startImageRecognition() {
            const file1 = document.getElementById('file-start').files[0], file2 = document.getElementById('file-target').files[0];
            const newN = parseInt(document.getElementById('import-size').value), newColors = parseInt(document.getElementById('import-colors').value);
            const newFolds = parseInt(document.getElementById('import-folds').value);

            if (!file1 || !file2) { showToast("请分别上传两张图片"); return; }
            if (isNaN(newN) || newN < 4 || newN > 12) { showToast("盘面大小请在 4-12 之间"); return; }
            if (isNaN(newColors) || newColors < 2 || newColors > 8) { showToast("颜色种数请在 2-8 之间"); return; }
            if (isNaN(newFolds) || newFolds < 1 || newFolds > 20) { showToast("折叠次数请在 1-20 之间"); return; }

            showToast("正在识别...");
            processImages(file1, file2, newN, newColors).then(res => {
                N = res.N; colorCount = res.colorCount; COLORS = res.palette;
                startGrid = res.startGrid; targetGrid = res.targetGrid; targetFoldCount = newFolds;
                solutionSteps = []; startCustomLevel(); showToast("识别成功！");
            }).catch(err => { console.error(err); showToast("识别失败，请确保图片样式正确"); });
        }

        function showToast(msg) {
            toastEl.innerText = msg; toastEl.classList.add('show');
            if (toastEl.timer) clearTimeout(toastEl.timer);
            toastEl.timer = setTimeout(() => { toastEl.classList.remove('show'); }, 2000);
        }

        undoBtn.addEventListener('click', goUndo);
        redoBtn.addEventListener('click', goRedo);
        helpBtn.addEventListener('click', () => rulesPopup.classList.add('show'));
        settingsBtn.addEventListener('click', openSettings);
        cameraBtn.addEventListener('click', () => { if (isAnimating) return; imageImportPopup.classList.add('show'); });
        
        document.getElementById('reset-btn').addEventListener('click', resetCurrentLevel);
        document.getElementById('new-btn').addEventListener('click', () => { let nextId = Math.floor(Math.random() * 100000) + 1; loadLevel(nextId); });
        document.getElementById('custom-btn').addEventListener('click', openCustomPopup);

        let timeLeft = 300;
        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval); timeLeft = 300; updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--; updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isVictory) {
                        document.getElementById('status-text').innerText = '时间到';
                        document.getElementById('status-text').style.color = '#DC143C';
                        isVictory = true; updateHistoryButtons();
                    }
                }
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0'), s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function initGame() {
            isGameStarted = false;
            document.getElementById('new-btn-text').innerText = '开始游戏';
            document.getElementById('new-btn-icon').innerText = '▶️';
            
            function createBlankGrid() {
                const grid = [];
                for (let x = 0; x < N; x++) { grid[x] = []; for (let y = 0; y < N; y++) { grid[x][y] = ['#ffffff', '#ffffff', '#ffffff', '#ffffff']; } }
                return grid;
            }
            
            startGrid = createBlankGrid(); targetGrid = createBlankGrid(); currentGrid = createBlankGrid();
            stateHistory = [deepCopyGrid(startGrid)]; currentStateIndex = 0; foldCount = 0; targetFoldCount = 6;
            
            document.getElementById('level-id').innerText = '-';
            document.getElementById('fold-count').innerText = '0';
            document.getElementById('target-folds').innerText = '-';
            document.getElementById('status-text').innerText = '准备就绪';
            document.getElementById('status-text').style.color = '#5bc0de';
            
            document.getElementById('match-count').innerText = '0';
            document.getElementById('total-count').innerText = N * N * 4;
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-text').innerText = '0%';
            document.getElementById('progress-fill').style.background = 'linear-gradient(90deg, #a18cd1 0%, #5bc0de 100%)';
            document.getElementById('progress-text').style.color = '#ccc';
            
            stopTimer();
            document.getElementById('timer').innerText = '--:--';
            
            updateHistoryButtons();
            refreshBothBoards();
        }

        // 【重要】加入延迟加载，等待 DOM 渲染完毕，解决跳转进入的黑屏
        window.addEventListener('load', () => {
            setTimeout(() => {
                resizeCanvases();
                initGame();
            }, 100);
        });
    </script>
