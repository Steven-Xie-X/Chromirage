<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>色块寻异</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #0d111a;
            --block-bg: #1e2437;
            --block-border: #353f5c;
            --dot-off: #2c324a;
            --text-main: #e2e8f0;
            --text-found: #facc15;
            --text-remaining: #4ade80;
            --text-mistake: #f87171;
            --success-glow: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        /* 顶部固定控制按钮 */
        .fixed-btn {
            position: fixed;
            top: 12px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 10000;
            color: #fff;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .fixed-btn:hover { background: rgba(255, 255, 255, 0.25); }
        #fullscreen-btn { left: 12px; }
        #settings-btn { left: 56px; }
        #answer-btn { right: 100px; display: none; }
        #help-btn { right: 56px; }
        #lock-btn { right: 12px; }

        /* 顶部信息区 */
        .top-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0; 
            width: 100%;
            padding-top: 8px;
            transition: all 0.3s;
        }

        .game-title {
            display: flex;
            gap: 8px;
            margin: 5px 0 10px;
        }

        .title-char {
            display: flex;
            justify-content: center;
            align-items: center;
            width: clamp(28px, 4.5vh, 42px);
            height: clamp(28px, 4.5vh, 42px);
            background-color: #ffffff;
            border-radius: 6px;
            font-size: clamp(18px, 3vh, 28px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .title-char:active { transform: scale(0.92); }

        .title-char:nth-child(1) { color: #E74C3C; }
        .title-char:nth-child(2) { color: #F1C40F; }
        .title-char:nth-child(3) { color: #3498DB; }
        .title-char:nth-child(4) { color: #2ECC71; }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
        }

        .btn {
            padding: 8px 24px;
            font-size: clamp(14px, 2vh, 18px);
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start {
            color: var(--bg-color);
            background: linear-gradient(135deg, #4ade80, #22c55e);
            box-shadow: 0 4px 10px rgba(74, 222, 128, 0.3);
        }

        .btn-custom {
            color: var(--bg-color);
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            box-shadow: 0 4px 10px rgba(96, 165, 250, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: clamp(14px, 2vh, 20px);
            font-weight: bold;
            font-family: monospace;
            margin-bottom: 8px;
            min-width: 320px;
        }

        .timer { color: #93c5fd; }
        .level-id { color: #fca5a5; }
        .play-mode-display {
            color: #a78bfa;
            padding: 0 10px;
            border-left: 1px solid #475569;
            border-right: 1px solid #475569;
        }

        .header {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: clamp(16px, 2.5vh, 22px);
            font-weight: bold;
            background: rgba(19, 23, 36, 0.8);
            padding: 8px 30px;
            border-radius: 10px;
            border: 1px solid var(--block-border);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .header span {
            font-family: monospace;
            font-size: clamp(18px, 3vh, 26px);
            margin-left: 5px;
        }

        .text-found { color: var(--text-found); }
        .text-remaining { color: var(--text-remaining); }
        .text-mistake { color: var(--text-mistake); }

        body.practice-mode .mistake-container { display: none; }

        /* --- 全屏模式精简UI --- */
        body.is-fullscreen .top-ui { padding-top: 2px; }
        body.is-fullscreen .game-title,
        body.is-fullscreen .controls { display: none; }
        body.is-fullscreen .info-bar { font-size: 12px; gap: 10px; margin-bottom: 2px; margin-top: 2px; }
        body.is-fullscreen .header { font-size: 14px; gap: 15px; padding: 2px 20px; margin-bottom: 2px; }
        body.is-fullscreen .header span { font-size: 16px; }
        body.is-fullscreen .game-container { padding: 2px; gap: 1vmin; }

        /* =========================================================
           盘面主体区
           ========================================================= */
        .game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center; 
            width: 100%;
            min-height: 0; 
            overflow: hidden; 
            gap: 2vmin; 
            transition: all 0.3s;
            position: relative;
        }

        /* DOM 墙（色块模式） */
        .wall-dom {
            background: var(--panel-bg); 
            border: 1px solid #1e2437;
            border-radius: 12px;
            padding: 0.8vmin;
            display: grid;
            gap: 0.8vmin; 
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
            aspect-ratio: 1 / 1; 
            flex-shrink: 0; 
        }

        /* --- 正常模式：玻璃罩容器 --- */
        .block {
            position: relative;
            background: var(--block-bg);
            border-radius: 10px; 
            border: 2px solid var(--block-border); 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            padding: 12%; 
            gap: 0px; 
            cursor: pointer;
            will-change: transform;
            transition: transform 0.1s ease, border-color 0.1s ease;
            min-width: 0;
            min-height: 0;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        .block::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 40%, rgba(0,0,0,0.1) 100%);
            pointer-events: none; 
            z-index: 10;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.1);
        }

        .block:hover { border-color: #4a5678; }
        .block.found { border-color: var(--success-glow); cursor: default; pointer-events: none; }
        .block.selected { border-color: #facc15; }
        .block.show-answer { border-color: #3b82f6; z-index: 2; }

        .dot {
            width: 84%; 
            height: 84%;
            border-radius: 50%;
            margin: auto;
            background-color: var(--dot-off);
            box-sizing: border-box;
            aspect-ratio: 1 / 1;
            z-index: 5;
        }

        body.is-mini .block { padding: 8%; border-width: 1px; border-radius: 6px; }
        body.is-mini .dot { width: 86%; height: 86%; }

        /* =========================================================
           魔方模式专属样式
           ========================================================= */
        .cube-board-wrapper {
            display: none;
            /* 核心：直接强制正方形 */
            aspect-ratio: 1 / 1; 
            flex-shrink: 0;
            /* 尺寸完全依赖 JS 设置具体的像素，这里只给个基础 */
            width: 100%; 
            height: auto;
        }
        
        body.cube-mode .wall-dom { display: none; }
        body.cube-mode .cube-board-wrapper { display: flex; }
        body.cube-mode .game-container { gap: 2vw; }

        /* 坐标轴网格布局 */
        .cube-inner-wrapper {
            display: grid;
            /* 留出坐标轴的位置 */
            grid-template-columns: 24px 1fr; 
            grid-template-rows: 24px 1fr;
            width: 100%;
            height: 100%;
        }

        .axis-corner { grid-area: 1 / 1; background: transparent; }
        .axis-top { grid-area: 1 / 2; position: relative; }
        .axis-left { grid-area: 2 / 1; position: relative; }

        /* 核心画布 */
        .main-canvas {
            grid-area: 2 / 2;
            width: 100%;
            height: 100%;
            background: #000; 
            border: 1px solid #475569; 
            display: block;
        }

        .axis-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* =========================================================
           响应式布局
           ========================================================= */
        @media (orientation: landscape) {
            .game-container { flex-direction: row; }
            body:not(.is-mini) .wall-dom, body.is-mini .wall-dom {
                height: 100%;
                width: auto;
                max-width: 48%;
            }
            .cube-board-wrapper {
                /* 高度占满 */
                height: 90%;
                width: auto;
            }
        }

        @media (orientation: landscape) and (min-width: 1024px) {
            body.is-mini .wall-dom {
                height: auto; 
                width: 25%;   
                max-width: 25%;
                max-height: 100%;
            }
        }

        @media (orientation: portrait) {
            body.is-mini .game-container { 
                flex-direction: row; 
                justify-content: center;
                overflow-y: auto;
                overflow-x: hidden;
                align-items: flex-start; 
                padding: 10px 0; 
                overscroll-behavior: contain;
            }
            body.is-mini .wall-dom { width: 48%; height: auto; }

            body:not(.is-mini):not(.is-fullscreen) .game-container { 
                flex-direction: column; 
                gap: 2vh; 
                overflow: hidden;
            }
            body:not(.is-mini):not(.is-fullscreen) .wall-dom { 
                flex: 1; 
                height: 0; 
                width: auto; 
                max-width: 90%; 
                margin: 0 auto; 
            }

            body:not(.is-mini).is-fullscreen .game-container { flex-direction: column; gap: 2vh; }
            body:not(.is-mini).is-fullscreen .wall-dom { width: 100%; max-width: min(100%, 45vh); height: auto; margin: 0 auto; }

            /* 竖屏魔方模式 */
            body.cube-mode .game-container {
                flex-direction: column;
                gap: 15px;
                align-items: center;
                overflow-y: auto;
            }
            .cube-board-wrapper {
                /* 宽度占满 */
                width: 90%;
                height: auto;
            }
        }

        /* =========================================================
           弹窗与提示
           ========================================================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .modal-overlay.hidden { display: none; }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 25px 30px;
            border-radius: 12px;
            color: #e2e8f0;
            width: 400px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .modal-content h3 {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #fff;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group label { font-size: 16px; color: #cbd5e1; }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 120px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #fff;
            outline: none;
            text-align: center;
        }

        .form-group input:focus { border-color: #3b82f6; }

        .switch-container { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        
        .mode-text {
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s;
            color: #64748b;
            cursor: pointer;
        }
        .mode-text.active-mini { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; font-weight: bold; }
        .mode-text.active-enlarge { background-color: rgba(74, 222, 128, 0.2); color: #4ade80; font-weight: bold; }

        .switch { position: relative; display: inline-block; width: 46px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3b82f6; 
            transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white;
            transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #4ade80; }
        input:checked + .slider:before { transform: translateX(22px); }

        .modal-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .btn-confirm, .btn-cancel {
            padding: 8px 24px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 15px; font-weight: bold;
        }
        .btn-confirm { background: #3b82f6; color: #fff; }
        .btn-cancel { background: #475569; color: #fff; }

        .rules-text { line-height: 1.6; font-size: 15px; color: #cbd5e1; max-height: 60vh; overflow-y: auto; padding-right: 10px; }
        .rules-text ul { padding-left: 20px; margin-top: 10px; }
        .rules-text li { margin-bottom: 8px; }
        .rules-text strong { color: #fcd34d; }

        .toast-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; justify-content: center; align-items: center;
            z-index: 10001; pointer-events: none;
        }
        .toast-overlay.hidden { display: none; }
        .toast-content {
            background: rgba(15, 23, 42, 0.95); color: #fff; padding: 20px 30px;
            border-radius: 12px; font-size: clamp(16px, 3vh, 24px); font-weight: bold;
            text-align: center; border: 2px solid var(--success-glow);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.3); pointer-events: auto; line-height: 1.5;
        }
    </style>
</head>
<body class="is-mini">

    <div class="fixed-btn" id="fullscreen-btn" title="全屏">⛶</div>
    <div class="fixed-btn" id="settings-btn" title="设置">⚙</div>
    <div class="fixed-btn" id="answer-btn" title="查看答案">💡</div>
    <div class="fixed-btn" id="help-btn" title="帮助">?</div>
    <div class="fixed-btn" id="lock-btn" title="锁定界面">🔓</div>

    <!-- 设置面板 -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>⚙️ 游戏设置</h3>
            <div class="form-group">
                <label id="label-size">盘面大小 (4-12)</label>
                <input type="number" id="set-size" min="4" max="12" value="10">
            </div>
            <div class="form-group">
                <label>差异块数 (数量或%)</label>
                <input type="text" id="set-diff" value="12%">
            </div>
            <div class="form-group">
                <label>颜色种数 (4-10)</label>
                <input type="number" id="set-color-count" min="4" max="10" value="8">
            </div>
            <div class="form-group" id="group-mini" style="justify-content: center;">
                <div class="switch-container">
                    <span id="text-mini" class="mode-text">迷你模式</span>
                    <label class="switch">
                        <input type="checkbox" id="set-mini">
                        <span class="slider"></span>
                    </label>
                    <span id="text-enlarge" class="mode-text">加大模式</span>
                </div>
            </div>
            <div class="form-group" style="justify-content: center;">
                <div class="switch-container">
                    <span id="text-challenge" class="mode-text active-mini">挑战模式</span>
                    <label class="switch">
                        <input type="checkbox" id="set-practice">
                        <span class="slider"></span>
                    </label>
                    <span id="text-practice" class="mode-text">练习模式</span>
                </div>
            </div>
            <div class="modal-buttons">
                <button id="settings-cancel" class="btn-cancel">取消</button>
                <button id="settings-confirm" class="btn-confirm">应用</button>
            </div>
        </div>
    </div>

    <!-- 帮助面板 -->
    <div id="help-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>📖 游戏规则与说明</h3>
            <div class="rules-text" id="help-content"></div>
            <div class="modal-buttons">
                <button id="help-close" class="btn-confirm" style="width: 100%;">我知道了</button>
            </div>
        </div>
    </div>

    <!-- 题号输入框 -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>请输入题号</h3>
            <div class="form-group" style="justify-content: center;">
                <input type="text" id="custom-id-input" maxlength="6" placeholder="1-6位字母数字" style="width: 100%;">
            </div>
            <div class="modal-buttons">
                <button id="modal-cancel" class="btn-cancel">取消</button>
                <button id="modal-confirm" class="btn-confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 自定义通用确认弹窗 -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="confirm-text">提示</h3>
            <div class="modal-buttons">
                <button id="confirm-cancel" class="btn-cancel">取消</button>
                <button id="confirm-ok" class="btn-confirm">确定</button>
            </div>
        </div>
    </div>

    <div id="toast-overlay" class="toast-overlay hidden">
        <div class="toast-content" id="toast-text"></div>
    </div>

    <div class="top-ui">
        <h1 class="game-title" id="main-title">
            <span id="char1" class="title-char">色</span>
            <span id="char2" class="title-char">块</span>
            <span class="title-char">寻</span>
            <span class="title-char">异</span>
        </h1>
        <div class="controls">
            <button class="btn btn-start" id="start-btn">开始游戏</button>
            <button class="btn btn-custom" id="custom-btn">指定编号</button>
        </div>
        <div class="info-bar">
            <div class="timer">计时: <span id="timer-display">00:00</span></div>
            <div class="play-mode-display" id="play-mode-display">迷你·挑战模式</div>
            <div class="level-id">题号: <span id="level-id-display">------</span></div>
        </div>
        <div class="header">
            <div><span id="label-found">找到</span> <span id="found-count" class="text-found">0</span></div>
            <div><span id="label-remaining">剩余</span> <span id="remaining-count" class="text-remaining">0</span></div>
            <div class="mistake-container">失误 <span id="mistake-count" class="text-mistake">0</span></div>
        </div>
    </div>

    <div class="game-container" id="game-container">
        <!-- 色块模式 DOM -->
        <div class="wall wall-dom" id="wall-left-dom"></div>
        <div class="wall wall-dom" id="wall-right-dom"></div>
        
        <!-- 魔方模式 Canvas 包装 -->
        <div class="cube-board-wrapper" id="cube-left-wrapper">
            <div class="cube-inner-wrapper">
                <div class="axis-corner"></div>
                <div class="axis-top"><canvas id="axis-top-left" class="axis-canvas"></canvas></div>
                <div class="axis-left"><canvas id="axis-left-left" class="axis-canvas"></canvas></div>
                <canvas id="canvas-left" class="main-canvas"></canvas>
            </div>
        </div>

        <div class="cube-board-wrapper" id="cube-right-wrapper">
            <div class="cube-inner-wrapper">
                <div class="axis-corner"></div>
                <div class="axis-top"><canvas id="axis-top-right" class="axis-canvas"></canvas></div>
                <div class="axis-left"><canvas id="axis-left-right" class="axis-canvas"></canvas></div>
                <canvas id="canvas-right" class="main-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ALL_COLORS = [
            '#E74C3C', '#F39C12', '#F1C40F', '#2ECC71', 
            '#1ABC9C', '#3498DB', '#9B59B6', '#FF6B81', 
            '#8B4513', '#95A5A6'
        ];
        
        let isCubeMode = false; 

        let settingsBlock = { size: 10, diffInput: '12%', colorCount: 8, isMini: true, isPractice: false };
        let settingsCube = { size: 10, diffInput: '1', colorCount: 8, isMini: false, isPractice: false };
        
        function getActiveSettings() {
            return isCubeMode ? settingsCube : settingsBlock;
        }

        let state = {
            rows: 10, cols: 10, diffCount: 12,
            grid: [], found: 0, remaining: 0, mistakes: 0, isPlaying: false,
            isPractice: false, 
            selectedIds: [], 
            isShowingAnswer: false,
            hasActiveGame: false
        };

        let timerInterval, secondsElapsed = 0, minutesElapsed = 0;
        let toastTimeout, toastDismissHandler = null;
        let isLocked = false;
        let rng = Math.random;
        let confirmAction = null;

        // Canvas 元素
        const canvasLeft = document.getElementById('canvas-left');
        const canvasRight = document.getElementById('canvas-right');
        const axisTopLeft = document.getElementById('axis-top-left');
        const axisTopRight = document.getElementById('axis-top-right');
        const axisLeftLeft = document.getElementById('axis-left-left');
        const axisLeftRight = document.getElementById('axis-left-right');

        const ctxLeft = canvasLeft.getContext('2d');
        const ctxRight = canvasRight.getContext('2d');
        const ctxAxisTopLeft = axisTopLeft.getContext('2d');
        const ctxAxisTopRight = axisTopRight.getContext('2d');
        const ctxAxisLeftLeft = axisLeftLeft.getContext('2d');
        const ctxAxisLeftRight = axisLeftRight.getContext('2d');

        let cellSize = 0;

        function xmur3(str) {
            for(var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                h = h << 13 | h >>> 19;
            }
            return function() {
                h = Math.imul(h ^ (h >>> 16), 2246822507);
                h = Math.imul(h ^ (h >>> 13), 3266489909);
                return (h ^= h >>> 16) >>> 0;
            }
        }

        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function resizeCanvas() {

            // 获取外层最大可用正方形边长
            const wrapper = document.getElementById('cube-left-wrapper');
            const rect = wrapper.getBoundingClientRect();
            // 取最短边作为绝对正方形
            const size = Math.min(rect.width, rect.height);
            if (size <= 0) return;
            
            const dpr = window.devicePixelRatio || 1;
            
            // 强制主画布的物理宽高一致
            canvasLeft.width = Math.floor(size * dpr);
            canvasLeft.height = Math.floor(size * dpr);
            canvasRight.width = Math.floor(size * dpr);
            canvasRight.height = Math.floor(size * dpr);
            
            // 强制CSS宽高一致
            canvasLeft.style.width = `${size}px`;
            canvasLeft.style.height = `${size}px`;
            canvasRight.style.width = `${size}px`;
            canvasRight.style.height = `${size}px`;

            ctxLeft.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxRight.setTransform(dpr, 0, 0, dpr, 0, 0);

            const topRect = axisTopLeft.getBoundingClientRect();
            const leftRect = axisLeftLeft.getBoundingClientRect();
            
            axisTopLeft.width = topRect.width * dpr;
            axisTopLeft.height = topRect.height * dpr;
            axisTopRight.width = topRect.width * dpr;
            axisTopRight.height = topRect.height * dpr;
            
            axisLeftLeft.width = leftRect.width * dpr;
            axisLeftLeft.height = leftRect.height * dpr;
            axisLeftRight.width = leftRect.width * dpr;
            axisLeftRight.height = leftRect.height * dpr;

            ctxAxisTopLeft.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxAxisTopRight.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxAxisLeftLeft.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxAxisLeftRight.setTransform(dpr, 0, 0, dpr, 0, 0);

            cellSize = size / settingsCube.size; // 逻辑像素大小，用于点击

            drawCubeBoard();
            drawAxes();
        }

        function drawAxes() {
            if (!isCubeMode) return;
            
            const topW = axisTopLeft.width / (window.devicePixelRatio || 1);
            const topH = axisTopLeft.height / (window.devicePixelRatio || 1);
            const leftW = axisLeftLeft.width / (window.devicePixelRatio || 1);
            const leftH = axisLeftLeft.height / (window.devicePixelRatio || 1);

            ctxAxisTopLeft.clearRect(0, 0, topW, topH);
            ctxAxisTopRight.clearRect(0, 0, topW, topH);
            ctxAxisLeftLeft.clearRect(0, 0, leftW, leftH);
            ctxAxisLeftRight.clearRect(0, 0, leftW, leftH);

            const fontSize = Math.max(8, Math.min(12, cellSize * 0.6));
            ctxAxisTopLeft.font = `${fontSize}px monospace`;
            ctxAxisTopLeft.fillStyle = '#cbd5e1';
            ctxAxisTopLeft.textAlign = 'center';
            ctxAxisTopLeft.textBaseline = 'middle';

            ctxAxisTopRight.font = ctxAxisTopLeft.font;
            ctxAxisTopRight.fillStyle = ctxAxisTopLeft.fillStyle;
            ctxAxisTopRight.textAlign = ctxAxisTopLeft.textAlign;
            ctxAxisTopRight.textBaseline = ctxAxisTopLeft.textBaseline;

            ctxAxisLeftLeft.font = ctxAxisTopLeft.font;
            ctxAxisLeftLeft.fillStyle = ctxAxisTopLeft.fillStyle;
            ctxAxisLeftLeft.textAlign = 'center';
            ctxAxisLeftLeft.textBaseline = 'middle';

            ctxAxisLeftRight.font = ctxAxisTopLeft.font;
            ctxAxisLeftRight.fillStyle = ctxAxisTopLeft.fillStyle;
            ctxAxisLeftRight.textAlign = ctxAxisLeftLeft.textAlign;
            ctxAxisLeftRight.textBaseline = ctxAxisLeftLeft.textBaseline;

            const isLarge = settingsCube.size > 20;

            for (let i = 0; i < settingsCube.size; i++) {
                const x = i * cellSize + cellSize / 2;
                const val = i + 1;
                
                if (!isLarge) {
                    ctxAxisTopLeft.fillText(val, x, topH / 2);
                    ctxAxisTopRight.fillText(val, x, topH / 2);
                } else {
                    if (val === 1 || val % 10 === 1) {
                        ctxAxisTopLeft.fillText(val, x, topH / 2 + 2);
                        ctxAxisTopRight.fillText(val, x, topH / 2 + 2);
                    } else {
                        ctxAxisTopLeft.beginPath();
                        ctxAxisTopLeft.moveTo(x, topH - 4);
                        ctxAxisTopLeft.lineTo(x, topH);
                        ctxAxisTopLeft.strokeStyle = '#64748b';
                        ctxAxisTopLeft.lineWidth = 1;
                        ctxAxisTopLeft.stroke();
                        
                        ctxAxisTopRight.beginPath();
                        ctxAxisTopRight.moveTo(x, topH - 4);
                        ctxAxisTopRight.lineTo(x, topH);
                        ctxAxisTopRight.strokeStyle = '#64748b';
                        ctxAxisTopRight.lineWidth = 1;
                        ctxAxisTopRight.stroke();
                    }
                }
            }

            for (let i = 0; i < settingsCube.size; i++) {
                const y = i * cellSize + cellSize / 2;
                const val = i + 1;
                
                if (!isLarge) {
                    ctxAxisLeftLeft.fillText(val, leftW / 2, y);
                    ctxAxisLeftRight.fillText(val, leftW / 2, y);
                } else {
                    if (val === 1 || val % 10 === 1) {
                        ctxAxisLeftLeft.fillText(val, leftW / 2, y);
                        ctxAxisLeftRight.fillText(val, leftW / 2, y);
                    } else {
                        ctxAxisLeftLeft.beginPath();
                        ctxAxisLeftLeft.moveTo(leftW - 4, y);
                        ctxAxisLeftLeft.lineTo(leftW, y);
                        ctxAxisLeftLeft.strokeStyle = '#64748b';
                        ctxAxisLeftLeft.lineWidth = 1;
                        ctxAxisLeftLeft.stroke();
                        
                        ctxAxisLeftRight.beginPath();
                        ctxAxisLeftRight.moveTo(leftW - 4, y);
                        ctxAxisLeftRight.lineTo(leftW, y);
                        ctxAxisLeftRight.strokeStyle = '#64748b';
                        ctxAxisLeftRight.lineWidth = 1;
                        ctxAxisLeftRight.stroke();
                    }
                }
            }
        }

        function drawCubeBoard() {
            if (!isCubeMode) return;
            
            const physicalW = canvasLeft.width;
            const physicalH = canvasLeft.height;
            
            // 使用 1:1 物理坐标系绘制，避免 DPR 引起的模糊与缝隙
            ctxLeft.setTransform(1, 0, 0, 1, 0, 0);
            ctxRight.setTransform(1, 0, 0, 1, 0, 0);
            
            // 纯黑背景
            ctxLeft.fillStyle = '#000000';
            ctxLeft.fillRect(0, 0, physicalW, physicalH);
            ctxRight.fillStyle = '#000000';
            ctxRight.fillRect(0, 0, physicalW, physicalH);

            // 核心：整数均匀分配算法
            const cols = settingsCube.size;
            const rows = settingsCube.size;
            
            const xCoords = new Array(cols + 1);
            const yCoords = new Array(rows + 1);
            
            const baseW = Math.floor(physicalW / cols);
            const remainderW = physicalW % cols;
            
            let currentX = 0;
            for (let i = 0; i <= cols; i++) {
                xCoords[i] = currentX;
                currentX += (i < remainderW) ? baseW + 1 : baseW;
            }
            
            const baseH = Math.floor(physicalH / rows);
            const remainderH = physicalH % rows;
            
            let currentY = 0;
            for (let i = 0; i <= rows; i++) {
                yCoords[i] = currentY;
                currentY += (i < remainderH) ? baseH + 1 : baseH;
            }

            for (let i = 0; i < state.grid.length; i++) {
                const b = state.grid[i];
                const row = Math.floor(i / cols);
                const col = i % cols;
                
                const px = xCoords[col];
                const py = yCoords[row];
                const wRect = xCoords[col+1] - px;
                const hRect = yCoords[row+1] - py;
                
                // 留出 1 物理像素作为黑线
                const fillW = wRect - 1;
                const fillH = hRect - 1;

                if (b.left.color) {
                    ctxLeft.fillStyle = b.left.color;
                    ctxLeft.fillRect(px, py, fillW, fillH);
                }

                if (b.right.color) {
                    ctxRight.fillStyle = b.right.color;
                    ctxRight.fillRect(px, py, fillW, fillH);
                }
                
                // 状态高亮
                if (b.found || state.selectedIds.includes(b.id) || (state.isShowingAnswer && b.isDifferent)) {
                    let strokeColor = '';
                    if (b.found) strokeColor = '#4ade80';
                    else if (state.selectedIds.includes(b.id)) strokeColor = '#facc15';
                    else if (state.isShowingAnswer && b.isDifferent) strokeColor = '#3b82f6';
                    
                    // 高亮框宽度 3 个物理像素
                    ctxLeft.strokeStyle = strokeColor;
                    ctxLeft.lineWidth = 3;
                    ctxLeft.strokeRect(px + 1.5, py + 1.5, wRect - 4, hRect - 4);
                    
                    ctxRight.strokeStyle = strokeColor;
                    ctxRight.lineWidth = 3;
                    ctxRight.strokeRect(px + 1.5, py + 1.5, wRect - 4, hRect - 4);
                }
            }
            
            // 恢复 DPR 比例
            const dpr = window.devicePixelRatio || 1;
            ctxLeft.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxRight.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

            if (state.hasActiveGame) {

        function executeStartGame(levelId) {
            if (!levelId) levelId = generateRandomId();
            levelIdDisplay.textContent = levelId;
            
            startBtn.innerHTML = '新的开始';

            const active = getActiveSettings();
            const modeStr = isCubeMode ? 'cube' : 'block';
            const seedStr = `${levelId}_${active.size}_${active.colorCount}_${active.diffInput}_${modeStr}`;
            const seedFunc = xmur3(seedStr);
            rng = mulberry32(seedFunc());

            const currentColors = ALL_COLORS.slice(0, active.colorCount);
            const total = active.size * active.size;
            
            let calcDiff = active.diffInput;
            if (calcDiff.includes('%')) {
                const percent = parseFloat(calcDiff);
                state.diffCount = Math.max(1, Math.min(total, Math.round(total * percent / 100)));
            } else {
                state.diffCount = Math.max(1, Math.min(total, parseInt(calcDiff) || 1));
            }

            state.isPractice = active.isPractice;
            state.isPlaying = true;
            state.hasActiveGame = true;
            state.found = 0;
            state.remaining = state.diffCount; 
            state.mistakes = 0;
            state.selectedIds = [];
            state.isShowingAnswer = false;
            
            updateTopModeDisplay(); 

            if (state.isPractice) {
                document.body.classList.add('practice-mode');
                labelFound.textContent = "已选";
                labelRemaining.textContent = "需选";
                answerBtn.style.display = 'flex';
                answerBtn.style.color = '#fff';
            } else {
                document.body.classList.remove('practice-mode');
                labelFound.textContent = "找到";
                labelRemaining.textContent = "剩余";
                answerBtn.style.display = 'none';
            }
            updateUI();

            state.grid = [];
            for (let i = 0; i < total; i++) {
                if (isCubeMode) {
                    const baseColor = generateRandomPoints(currentColors);
                    state.grid.push({
                        id: i,
                        left: { color: baseColor },
                        right: { color: baseColor },
                        isDifferent: false,
                        found: false
                    });
                } else {
                    const basePoints = generateRandomPoints(currentColors);
                    state.grid.push({
                        id: i,
                        left: basePoints.map(p => ({ ...p })),
                        right: basePoints.map(p => ({ ...p })),
                        isDifferent: false,
                        found: false
                    });
                }
            }

            const indices = Array.from({ length: total }, (_, i) => i);
            shuffle(indices);
            
            const diffIndices = indices.slice(0, state.diffCount);

            diffIndices.forEach(idx => {
                const block = state.grid[idx];
                block.isDifferent = true;
                
                if (isCubeMode) {
                    let newColor;
                    do { newColor = currentColors[Math.floor(rng() * currentColors.length)]; } while (newColor === block.left.color);
                    block.right.color = newColor;
                } else {
                    const numPointsToChange = rng() < 0.5 ? 1 : 2;
                    const pointIndices = [0,1,2,3,4,5,6,7,8];
                    shuffle(pointIndices);
                    const targetPoints = pointIndices.slice(0, numPointsToChange);

                    targetPoints.forEach(pIdx => {
                        const leftColor = block.left[pIdx].color;
                        if (rng() < 0.5) {
                            if (leftColor) { block.right[pIdx].color = null; } 
                            else { block.right[pIdx].color = currentColors[Math.floor(rng() * currentColors.length)]; }
                        } else {
                            if (leftColor) {
                                let newColor;
                                do { newColor = currentColors[Math.floor(rng() * currentColors.length)]; } while (newColor === leftColor);
                                block.right[pIdx].color = newColor;
                            } else { block.right[pIdx].color = currentColors[Math.floor(rng() * currentColors.length)]; }
                        }
                    });
                }
            });

            if (isCubeMode) {
                drawCubeBoard();
            } else {
                renderDomBoard();
            }
            
            document.getElementById('game-container').scrollTop = 0;
            startTimer();
        }

        function handleBlockClick(blockData, side, blockEl) {
            if (!state.isPlaying || state.isShowingAnswer) return;

            if (state.isPractice) {
                const idx = state.selectedIds.indexOf(blockData.id);
                
                if (idx > -1) {
                    state.selectedIds.splice(idx, 1);
                } else {
                    if (state.selectedIds.length >= state.diffCount) {
                        showToast('已选满，请取消后再选', false);
                        return;
                    }
                    state.selectedIds.push(blockData.id);
                }
                
                updateUI();
                
                if (isCubeMode) {
                    drawCubeBoard();
                } else {
                    const otherSideDom = (side === 'left' ? rightWallDom : leftWallDom).children;
                    if (idx > -1) {
                        blockEl.classList.remove('selected');
                        otherSideDom[blockData.id].classList.remove('selected');
                    } else {
                        blockEl.classList.add('selected');
                        otherSideDom[blockData.id].classList.add('selected');
                    }
                }
                
                if (state.selectedIds.length === state.diffCount) {
                    let allCorrect = state.selectedIds.every(id => state.grid[id].isDifferent);
                    if (allCorrect) {
                        state.isPlaying = false;
                        state.hasActiveGame = false;
                        stopTimer();
                        showToast(`练习成功！全部找对！<br>题号：${levelIdDisplay.textContent}<br>用时：${timerDisplay.textContent}`, true, false);
                    }
                }
            } else {
                if (blockData.isDifferent) {
                    blockData.found = true;
                    state.found++;
                    state.remaining--;
                    
                    if (isCubeMode) {
                        drawCubeBoard();
                    } else {
                        blockEl.classList.add('found');
                        const otherSideDom = (side === 'left' ? rightWallDom : leftWallDom).children;
                        otherSideDom[blockData.id].classList.add('found');
                    }

                    updateUI();

                    if (state.remaining === 0) {
                        state.isPlaying = false;
                        state.hasActiveGame = false;
                        stopTimer();
                        showToast(`恭喜找出了所有不同！<br>题号：${levelIdDisplay.textContent}<br>失误：${state.mistakes} 次<br>用时：${timerDisplay.textContent}`, true, false);
                    }
                } else {
                    state.mistakes++;
                    updateUI();
                    
                    if (!isCubeMode && blockEl) {
                        blockEl.style.transform = 'scale(0.85)';
                        setTimeout(() => blockEl.style.transform = 'scale(1)', 100);
                    }
                }
            }
        }

        function updateUI() {
            if (state.isPractice) {
                foundEl.textContent = state.selectedIds.length;
                remainingEl.textContent = state.diffCount - state.selectedIds.length;
            } else {
                foundEl.textContent = state.found;
                remainingEl.textContent = state.remaining;
            }
            mistakeEl.textContent = state.mistakes;
        }
        
        function showToast(text, isSuccess = true, autoHide = true) {
            toastText.innerHTML = text;
            toastText.style.borderColor = isSuccess ? 'var(--success-glow)' : 'var(--text-mistake)';
            toastText.style.boxShadow = isSuccess ? '0 0 30px rgba(74, 222, 128, 0.3)' : '0 0 30px rgba(248, 113, 113, 0.3)';
            
            toastOverlay.classList.remove('hidden');
            
            if (toastDismissHandler) document.removeEventListener('click', toastDismissHandler);
            
            toastDismissHandler = () => {
                toastOverlay.classList.add('hidden');
                document.removeEventListener('click', toastDismissHandler);
                clearTimeout(toastTimeout);
                toastDismissHandler = null;
            };
            
            setTimeout(() => document.addEventListener('click', toastDismissHandler), 10);
            clearTimeout(toastTimeout);
            if (autoHide) {
                toastTimeout = setTimeout(toastDismissHandler, 1500);
            }
        }

        startBtn.addEventListener('click', () => requestStartGame());
        
        customBtn.addEventListener('click', () => {
            if (state.hasActiveGame) {
                showConfirm('当前游戏尚未完成，是否放弃并开始新游戏？', () => {
                    customIdInput.value = '';
                    modalOverlay.classList.remove('hidden');
                    customIdInput.focus();
                });
            } else {
                customIdInput.value = '';
                modalOverlay.classList.remove('hidden');
                customIdInput.focus();
            }
        });
        
        modalCancel.addEventListener('click', () => modalOverlay.classList.add('hidden'));
        
        modalConfirm.addEventListener('click', () => {
            const val = customIdInput.value.trim();
            if (!/^[A-Za-z0-9]{1,6}$/.test(val)) {
                showToast('题号格式不正确<br>请输入1-6位字母和数字', false);
                return;
            }
            modalOverlay.classList.add('hidden');
            executeStartGame(val.toUpperCase());
        });
        
        customIdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') modalConfirm.click();
        });

        answerBtn.addEventListener('click', () => {
            if (!state.isPractice || !state.isPlaying) return;
            state.isShowingAnswer = !state.isShowingAnswer;
            
            if (isCubeMode) {
                drawCubeBoard();
            } else {
                state.grid.forEach((blockData, i) => {
                    if (blockData.isDifferent) {
                        if (state.isShowingAnswer) {
                            leftWallDom.children[i].classList.add('show-answer');
                            rightWallDom.children[i].classList.add('show-answer');
                        } else {
                            leftWallDom.children[i].classList.remove('show-answer');
                            rightWallDom.children[i].classList.remove('show-answer');
                        }
                    }
                });
            }
            answerBtn.style.color = state.isShowingAnswer ? '#facc15' : '#fff';
        });

        document.getElementById('settings-btn').addEventListener('click', () => {
            const active = getActiveSettings();
            setSizeInput.value = active.size;
            setDiffInput.value = active.diffInput;
            setColorCountInput.value = active.colorCount; 
            setMiniInput.checked = !active.isMini; 
            setPracticeInput.checked = active.isPractice;
            updateDisplayModeText(); 
            updatePlayModeText();
            settingsModal.classList.remove('hidden');
        });

        settingsCancel.addEventListener('click', () => settingsModal.classList.add('hidden'));

        settingsConfirm.addEventListener('click', () => {
            let newSize = parseInt(setSizeInput.value);
            
            if (isCubeMode) {
                if (isNaN(newSize) || newSize < 5 || newSize > 100) {
                    showToast('魔方模式盘面大小必须在 5-100 之间', false);
                    return;
                }
            } else {
                if (isNaN(newSize) || newSize < 4 || newSize > 12) {
                    showToast('色块模式盘面大小必须在 4-12 之间', false);
                    return;
                }
            }

            let newDiff = setDiffInput.value.trim();
            if (!newDiff) {
                showToast('请输入差异块数', false);
                return;
            }

            let newColorCount = parseInt(setColorCountInput.value);
            if (isNaN(newColorCount) || newColorCount < 4 || newColorCount > 10) {
                showToast('颜色种数必须在 4-10 之间', false);
                return;
            }

            if (isCubeMode) {
                settingsCube.size = newSize;
                settingsCube.diffInput = newDiff;
                settingsCube.colorCount = newColorCount;
                settingsCube.isPractice = setPracticeInput.checked;
            } else {
                settingsBlock.size = newSize;
                settingsBlock.diffInput = newDiff;
                settingsBlock.colorCount = newColorCount;
                settingsBlock.isMini = !setMiniInput.checked;
                settingsBlock.isPractice = setPracticeInput.checked;
            }
            
            settingsModal.classList.add('hidden');
            
            state.rows = newSize;
            state.cols = newSize;
            
            resetBoardToEmpty();
        });

        helpBtn.addEventListener('click', () => helpModal.classList.remove('hidden'));
        helpClose.addEventListener('click', () => helpModal.classList.add('hidden'));

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => showToast('全屏失败或不支持', false));
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = '🗗';
                document.body.classList.add('is-fullscreen');
            } else {
                fullscreenBtn.textContent = '⛶';
                document.body.classList.remove('is-fullscreen');
            }
            setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 50);
        });

        lockBtn.addEventListener('click', () => {
            isLocked = !isLocked;
            lockBtn.textContent = isLocked ? '🔒' : '🔓';
            
            if (isLocked) {
                document.body.style.overflow = 'hidden';
                document.documentElement.style.overflow = 'hidden';
                metaViewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no');
            } else {
                document.body.style.overflow = '';
                document.documentElement.style.overflow = '';
                metaViewport.setAttribute('content', 'width=device-width, initial-scale=1.0, user-scalable=yes');
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (isLocked && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (isLocked && now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        document.addEventListener('wheel', (e) => {
            if (isLocked && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('resize', () => {
            if (isCubeMode) resizeCanvas();
        });

        resetBoardToEmpty();
    </script>
</body>
</html>
